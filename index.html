*{box-sizing:border-box;margin:0;padding:0}

.app{display:flex;height:calc(100vh - 44px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}

.spec-list{flex:1;overflow-y:auto;padding:6px}

.spec-item:hover{border-color:#1a3a5c;background:#f0f4f8}
.spec-item.active{border-color:#1a3a5c;background:#e8f0f8}
.spec-item-name{font-size:13px;font-weight:500;margin-bottom:2px}

.btn-primary{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.btn-primary:hover{background:#0f2740}
.btn-danger{background:#fff;color:#c62828;border-color:#e0a0a0}

.btn-sm{padding:4px 10px;font-size:12px}
.btn-block{width:100%;margin-bottom:6px;display:block}

.tab{padding:6px 12px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:700}
.panel{display:none}.panel.active{display:block}

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.field{margin-bottom:7px}
.fl{font-size:12px;color:#555;display:block;margin-bottom:2px;font-weight:500}
input[type=text],input[type=number],select,textarea{width:100%;font-size:13px;padding:6px 9px;border:1.5px solid #b0bec5;border-radius:5px;background:#fff;color:#222;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3a5c;box-shadow:0 0 0 2px rgba(26,58,92,.1)}
textarea{resize:vertical;min-height:50px;line-height:1.5}
.ing-table{width:100%;border-collapse:collapse;font-size:12px}
.ing-table th{background:#eef2f7;padding:5px 6px;border:1px solid #ccc;font-size:11px;font-weight:700;text-align:center}

.search-box{position:relative}

// ===== ユーティリティ =====
function h(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function gv(id) { var el=document.getElementById(id); return el ? el.value : ''; }
function sv(id, val) { var el=document.getElementById(id); if(el) el.value = val || ''; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' error' : '') + ' show';
  setTimeout(function(){ t.className = 'toast' + (isErr ? ' error' : ''); }, 3000);
}

// ===== Firebase初期化 =====
function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    db = firebase.firestore();
    document.getElementById('status-dot').className = 'status-dot online';
    document.getElementById('status-text').textContent = 'Firestore 接続済み';
    loadList();
  } catch(e) {
    document.getElementById('status-text').textContent = '接続エラー';
    console.error(e);
    alert('Firebase接続エラー: ' + e.message);
  }
}

// ===== リスト操作 =====
async function loadList() {
  if (!db) return;
  document.getElementById('spec-list').innerHTML = '<div class="loading"><div class="spinner"></div>読込中...</div>';
  try {
    var snap = await db.collection('product_specs').orderBy('updatedAt','desc').get();
    specListCache = [];
    snap.forEach(function(doc){ specListCache.push(Object.assign({id:doc.id}, doc.data())); });
    renderList();
  } catch(e) {
    document.getElementById('spec-list').innerHTML = '<div style="padding:10px;color:#c62828;font-size:12px">読込失敗: '+e.message+'</div>';
  }
}

function renderList() {
  var el = document.getElementById('spec-list');
  if (!specListCache.length) { el.innerHTML = '<div class="empty-state"><p style="font-size:13px">規格書がありません</p></div>'; return; }
  var html = '';
  specListCache.forEach(function(s) {
    var d = s.updatedAt ? new Date(s.updatedAt.toDate()).toLocaleDateString('ja-JP') : '';
    var active = s.id === currentSpecId ? ' active' : '';
    var isSample = s.isSample ? true : false;
    var itemStyle = isSample ? 'opacity:0.5;border-style:dashed;' : '';
    var badge = isSample ? '<span style="font-size:10px;background:#e8f0f8;color:#1a3a5c;border-radius:3px;padding:1px 5px;margin-left:4px">見本</span>' : '';
    html += '<div class="spec-item'+active+'" onclick="openSpec(\''+s.id+'\')" style="'+itemStyle+'">';
    html += '<div class="spec-item-name">'+h(s.basic && s.basic.pname ? s.basic.pname : '（名称未設定）')+badge+'</div>';
    html += '<div class="spec-item-meta">'+h(s.basic && s.basic.ptype ? s.basic.ptype : '')+' | '+d+'</div>';
    html += '</div>';
  });
  el.innerHTML = html;
}

// ===== 新規作成 =====
function newSpec() {
  currentSpecId = null;
  currentSpec = makeEmptySpec();
  renderList();
  renderEditor();
}

// ===== 既存を開く =====
async function openSpec(id) {
  if (!db) { toast('Firestoreに接続されていません',true); return; }
  currentSpecId = id;
  renderList();
  document.getElementById('main-area').innerHTML = '<div class="loading"><div class="spinner"></div>読込中...</div>';
  try {
    var doc = await db.collection('product_specs').doc(id).get();
    if (!doc.exists) { toast('規格書が見つかりません',true); return; }
    currentSpec = doc.data();
    if (!currentSpec.ings) currentSpec.ings = JSON.parse(JSON.stringify(DEFAULT_INGS));
    if (!currentSpec.procs) currentSpec.procs = JSON.parse(JSON.stringify(DEFAULT_PROCS));
    if (!currentSpec.pkg) currentSpec.pkg = makeEmptySpec().pkg;
    if (!currentSpec.basic) currentSpec.basic = makeEmptySpec().basic;
    if (!currentSpec.nutrition) currentSpec.nutrition = makeEmptySpec().nutrition;
    if (!currentSpec.cost) currentSpec.cost = {laborCost:0,utilityCost:0,packagingCost:0,otherCost:0};
    currentSpec.ings.forEach(function(ing){ if(ing.unitPrice==null) ing.unitPrice=0; });
    renderEditor();
    setTimeout(applyMasterToSpec, 300);
  } catch(e) {
    toast('読込失敗: '+e.message, true);
    console.error(e);
  }
}

// ===== 削除（削除ボタンから） =====
function doDelete() {
  if (!currentSpecId || !currentSpec) return;
  var name = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : 'この規格書';
  deleteTargetId = currentSpecId;
  document.getElementById('del-msg').textContent = '「' + name + '」を削除しますか？この操作は取り消せません。';
  document.getElementById('del-modal').classList.add('open');
}

// ===== 見本フラグ切替 =====
function toggleSample() {
  if (!currentSpec) return;
  currentSpec.isSample = !currentSpec.isSample;
  saveSpec();
  renderEditor();
}

// ===== 保存 =====
async function saveSpec() {
  if (!db) { toast('Firestoreに接続されていません',true); return; }
  collectForm();
  currentSpec.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  try {
    if (currentSpecId) {
      await db.collection('product_specs').doc(currentSpecId).set(currentSpec);
      toast('保存しました ✓');
    } else {
      var ref = await db.collection('product_specs').add(currentSpec);
      currentSpecId = ref.id;
      toast('新規保存しました ✓');
    }
    loadList();
  } catch(e) {
    toast('保存失敗: '+e.message, true);
    console.error(e);
  }
}

// ===== 削除 =====
function askDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('del-msg').textContent = '「'+name+'」を削除しますか？この操作は取り消せません。';
  document.getElementById('del-modal').classList.add('open');
}

async function confirmDelete() {
  if (!deleteTargetId || !db) return;
  try {
    await db.collection('product_specs').doc(deleteTargetId).delete();
    document.getElementById('del-modal').classList.remove('open');
    if (currentSpecId === deleteTargetId) {
      currentSpecId = null; currentSpec = null;
      document.getElementById('main-area').innerHTML = '<div class="empty-state"><div style="font-size:48px">📄</div><p>左の一覧から規格書を選んでください</p></div>';
    }
    toast('削除しました');
    loadList();
  } catch(e) { toast('削除失敗: '+e.message, true); }
}

// ===== フォーム収集 =====
function collectForm() {
  if (!currentSpec) return;
  var b = currentSpec.basic;
  ['pname','ptype','amount','expiry','country','storage','storage2','gmo','preservative','degradation','contami','mfr','maddr','created'].forEach(function(k){
    var el = document.getElementById('f-'+k); if(el) b[k] = el.value;
  });
  var n = currentSpec.nutrition;
  ['e','p','f','c','s','w','sf','su','unit','note'].forEach(function(k){
    var el = document.getElementById('n-'+k); if(el) n[k] = el.value;
  });
  var pk = currentSpec.pkg;
  ['puD','puW','puH','puN','puWt','puMat','pcD','pcW','pcH','pcN','pcWt','pcMat'].forEach(function(k){
    var el = document.getElementById('pk-'+k); if(el) pk[k] = el.value;
  });
  var lt = document.getElementById('label-text'); if(lt) currentSpec.labelText = lt.value;
  var rn = document.getElementById('r-notes'); if(rn) currentSpec.notes = rn.value;
  var rc = document.getElementById('r-cooking'); if(rc) currentSpec.cooking = rc.value;
  var rs = document.getElementById('r-special'); if(rs) currentSpec.special = rs.value;
  currentSpec.allergens = [];
  document.querySelectorAll('#allergen-grid input:checked').forEach(function(cb){ currentSpec.allergens.push(cb.value); });
  if (!currentSpec.cost) currentSpec.cost = {};
  var co = currentSpec.cost;
  ['laborCost','utilityCost','packagingCost','otherCost'].forEach(function(k){
    var el = document.getElementById('co-'+k); if(el) co[k] = +el.value || 0;
  });
}

// ===== タブ切替 =====
function swTab(name) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  // masterパネルは動的生成
  if (name === 'master') {
    var masterPanel = document.getElementById('panel-master');
    if (!masterPanel) {
      var mhtml = renderMasterPanel();
      var mainEl = document.getElementById('main-area');
      var div = document.createElement('div');
      div.innerHTML = mhtml;
      mainEl.appendChild(div.firstChild);
    }
    setTimeout(renderMasterTables, 50);
  }
  var tab = document.getElementById('tab-'+name);
  var panel = document.getElementById('panel-'+name);
  if(tab) tab.classList.add('active');
  if(panel) panel.classList.add('active');
  if(name === 'preview') genPreview();
}

function fld(label, type, id, val, extra) {
  return '<div class="field"><label class="fl">' + label + '</label>'
    + '<input type="' + type + '" id="' + id + '" value="' + (val||'') + '" ' + (extra||'') + '>'

// ===== 原材料テーブル =====
function calcRatio() {
  var total = currentSpec.ings.reduce(function(s,ing){ return s + (ing.amount||0); }, 0);
  currentSpec.ings.forEach(function(ing){
    ing.ratio = total > 0 ? ((ing.amount||0)/total*100).toFixed(1) : '0.0';
  });
  return total;
}

function ingCost(ing) {
  // 使用量(g) × 単価(円/kg) ÷ 1000
  return ((ing.amount||0) * (ing.unitPrice||0)) / 1000;
}

function updateIngField(i, field, val) {
  currentSpec.ings[i][field] = (field === 'amount' || field === 'unitPrice') ? +val : val;
  if (field === 'amount' || field === 'unitPrice') {
    // 重量・単価変更 → 栄養計算＋原価計算を同時更新
    calcNutritionSilent();
    updateIngSummary(); // recalcCostを内包
  } else if (field === 'name') {
    // 名前変更 → マスターを即照合して単価・栄養素を自動セット
    var ing = currentSpec.ings[i];
    var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
    var mat = masterData.materialPrices.find(function(m) {
      if (!matchMaster(ing.name, m.name)) return false;
      return !m.limitedTo || m.limitedTo.trim() === '' || m.limitedTo === pname;
    });
    if (!mat) mat = masterData.materialPrices.find(function(m){ return matchMaster(ing.name, m.name); });
    if (!mat) {
      // FOOD_DBからも検索
      var fd = FOOD_DB[ing.name];
      if (fd) { ing.e=fd.e; ing.p=fd.p; ing.f=fd.f; ing.c=fd.c; ing.s=fd.s; }
    }
    if (mat) {
      if (mat.unitPrice > 0) {
        ing.unitPrice = mat.unitPrice;
        // 単価セルをリアルタイム更新
        var prcEl = document.getElementById('prc-'+i);
        if (prcEl) prcEl.value = mat.unitPrice;
      }
      if (mat.e > 0) ing.e = mat.e;
      if (mat.p != null) ing.p = mat.p;
      if (mat.f != null) ing.f = mat.f;
      if (mat.c != null) ing.c = mat.c;
      if (mat.s != null) ing.s = mat.s;
    }
    autoLabelText();
    updateIngSummary();
  } else if (field === 'allergens') {
    syncAllergens();
    updateIngSummary();
  } else {
    updateIngSummary();
  }
}

function updateIngSummary() {
  var total = calcRatio();
  var totalCost = currentSpec.ings.reduce(function(s,ing){ return s+ingCost(ing); }, 0);
  // フッター更新
  var fw = document.getElementById('foot-weight');
  var fc2 = document.getElementById('foot-cost');
  if (fw) fw.textContent = total.toFixed(1) + 'g';
  if (fc2) fc2.textContent = totalCost > 0 ? totalCost.toFixed(1) + '円' : '—';
  // バナー更新
  var bm = document.getElementById('banner-mat');
  var bw = document.getElementById('banner-weight');
  if (bm) bm.textContent = totalCost.toFixed(1) + ' 円';
  if (bw) bw.textContent = total.toFixed(1) + ' g';
  // 配合比セル更新（再描画なし）
  currentSpec.ings.forEach(function(ing, i) {
    var rCell = document.getElementById('ratio-cell-'+i);
    var cCell = document.getElementById('cost-cell-'+i);
    if (rCell) rCell.textContent = (ing.ratio || '0.0') + '%';
    if (cCell) {
      var c = ingCost(ing);
      cCell.textContent = c > 0 ? c.toFixed(1) + ' 円' : '—';
      cCell.style.color = c > 0 ? '#0f5132' : '#bbb';
      cCell.style.fontWeight = c > 0 ? '700' : '400';
    }
  });
  recalcCost();
}

function renderIngTbody() {
  var tbody = document.getElementById('ing-tbody');
  if (!tbody) return;
  calcRatio();
  var html = '';
  currentSpec.ings.forEach(function(ing, i) {
    var gmoOpts = ['','非組換え','組換え','不分別'].map(function(o){
      return '<option'+(ing.gmo===o?' selected':'')+'>'+o+'</option>';
    }).join('');
    var cost = ingCost(ing);
    var rowBg = i % 2 === 0 ? '#fff' : '#fafcff';
    html += '<tr style="background:'+rowBg+'">';
    html += '<td style="text-align:center;color:#aaa;font-size:11px;width:28px">'+(i+1)+'</td>';
    // 原材料名
    html += '<td><input type="text" value="'+h(ing.name)+'" style="font-weight:500" oninput="updateIngField('+i+',\'name\',this.value)"></td>';
    // 国名
    html += '<td><input type="text" value="'+h(ing.country)+'" oninput="updateIngField('+i+',\'country\',this.value)"></td>';
    // アレルゲン
    var alStyle = ing.allergens ? 'color:#c62828;font-weight:500' : '';
    html += '<td><input type="text" value="'+h(ing.allergens)+'" style="'+alStyle+'" oninput="updateIngField('+i+',\'allergens\',this.value)"></td>';
    // 重量(g) - onchangeでフォーカスを維持しながら更新
    html += '<td style="background:#f0faf4">';
    html += '<input type="number" id="amt-'+i+'" value="'+(ing.amount||0)+'" min="0" step="0.1"';
    html += ' style="text-align:right;font-weight:600;width:100%"';
    html += ' onchange="updateIngField('+i+',\'amount\',this.value)">';
    html += '</td>';
    // 単価(円/kg)
    html += '<td style="background:#f0faf4">';
    html += '<input type="number" id="prc-'+i+'" value="'+(ing.unitPrice||0)+'" min="0" step="1"';
    html += ' style="text-align:right;width:100%"';
    html += ' onchange="updateIngField('+i+',\'unitPrice\',this.value)">';
    html += '</td>';
    // 原材料費（自動計算）
    var costTxt = cost > 0 ? cost.toFixed(1)+' 円' : '—';
    var costColor = cost > 0 ? '#0f5132' : '#bbb';
    var costFw = cost > 0 ? '700' : '400';
    html += '<td id="cost-cell-'+i+'" style="text-align:right;padding:0 8px;background:#f0faf4;';
    html += 'color:'+costColor+';font-size:12px;font-weight:'+costFw+'">'+costTxt+'</td>';
    // 配合比（自動）
    html += '<td id="ratio-cell-'+i+'" style="text-align:center;background:#e8f4fd;';
    html += 'font-size:12px;color:#1a3a5c;font-weight:600">'+(ing.ratio||'0.0')+'%</td>';
    // 特色原材料
    html += '<td><input type="text" value="'+h(ing.feature)+'" oninput="updateIngField('+i+',\'feature\',this.value)"></td>';
    // 添加物用途
    html += '<td><input type="text" value="'+h(ing.addUse)+'" oninput="updateIngField('+i+',\'addUse\',this.value)"></td>';
    // 遺伝子組換え
    html += '<td><select style="font-size:11px" onchange="updateIngField('+i+',\'gmo\',this.value)">'+gmoOpts+'</select></td>';
    // 削除ボタン
    html += '<td style="text-align:center"><button class="btn btn-sm btn-danger" onclick="removeIng('+i+')" style="padding:2px 6px">✕</button></td>';
    html += '</tr>';
  });
  tbody.innerHTML = html;
  updateIngSummary();
  autoLabelText();
}

function removeIng(i) { currentSpec.ings.splice(i,1); renderIngTbody(); syncAllergens(); }

function searchFood() {
  var q = document.getElementById('isearch').value;
  var r = document.getElementById('food-results');
  if (!q || q.length < 1) { r.style.display='none'; return; }
  var matches = Object.keys(FOOD_DB).filter(function(k){ return k.indexOf(q) >= 0; });
  if (!matches.length) { r.style.display='none'; return; }
  var html = '';
  matches.slice(0,8).forEach(function(name){
    html += '<div class="sr-item" onmousedown="addFoodIng(\''+name+'\')">'+name+'</div>';
  });
  r.innerHTML = html;
  r.style.display = 'block';
}

function showFoodResults() { if(document.getElementById('isearch').value) searchFood(); }
function hideFoodResults() { setTimeout(function(){ var r=document.getElementById('food-results'); if(r) r.style.display='none'; }, 200); }

// ===== 一括表示テキスト自動生成 =====
function autoLabelText() {
  var el = document.getElementById('label-text');
  if (!el) return;
  var names = currentSpec.ings.map(function(i){ return i.name; }).join('、');
  var checked = [];
  document.querySelectorAll('#allergen-grid input:checked').forEach(function(cb){ checked.push(cb.value); });
  el.value = names + (checked.length ? '、(一部に'+checked.join('・')+'を含む)' : '');
}

// ===== アレルゲン =====
function renderAllergenGrid() {
  var g = document.getElementById('allergen-grid');
  if (!g) return;
  var al = currentSpec.allergens || [];
  var html = '';
  ALL_ALLERGENS.forEach(function(a){
    html += '<label class="al-chip"><input type="checkbox" value="'+a+'" '+(al.indexOf(a)>=0?'checked':'')+' onchange="autoLabelText()"> '+a+'</label>';
  });
  g.innerHTML = html;
  syncAllergens();
}

function syncAllergens() {
  var detected = new Set();
  currentSpec.ings.forEach(function(ing){
    if (ing.allergens) ing.allergens.split(/[・、,\s]+/).filter(Boolean).forEach(function(a){ detected.add(a); });
  });
  document.querySelectorAll('#allergen-grid input').forEach(function(cb){
    if (detected.has(cb.value)) cb.checked = true;
  });
  autoLabelText();
}

// ===== 原価再計算 =====
function recalcCost() {
  var ingMaterial = currentSpec.ings.reduce(function(s,ing){ return s+ingCost(ing); },0);
  var co = currentSpec.cost || {};
  var labor = +(document.getElementById('co-laborCost') ? document.getElementById('co-laborCost').value : co.laborCost) || 0;
  var utility = +(document.getElementById('co-utilityCost') ? document.getElementById('co-utilityCost').value : co.utilityCost) || 0;
  var packaging = +(document.getElementById('co-packagingCost') ? document.getElementById('co-packagingCost').value : co.packagingCost) || 0;
  var other = +(document.getElementById('co-otherCost') ? document.getElementById('co-otherCost').value : co.otherCost) || 0;
  var total = ingMaterial + labor + utility + packaging + other;

  var detEl = document.getElementById('cost-ing-detail');
  if (detEl) {
    var rows = '';
    currentSpec.ings.forEach(function(ing){
      var c = ingCost(ing);
      if (!ing.name && !c) return;
      rows += '<tr><td style="padding:3px 8px;font-size:12px">'+h(ing.name)+'</td>'
        +'<td style="padding:3px 8px;text-align:right;font-size:12px">'+(ing.amount||0).toFixed(1)+'g</td>'
        +'<td style="padding:3px 8px;text-align:right;font-size:12px">'+(ing.unitPrice||0).toLocaleString()+'円/kg</td>'
        +'<td style="padding:3px 8px;text-align:right;font-size:12px;color:#1a3a5c">'+c.toFixed(1)+'円</td></tr>';
    });
    detEl.innerHTML = '<table style="width:100%;border-collapse:collapse;margin-bottom:8px">'
      +'<thead><tr style="background:#eef2f7">'
      +'<th style="padding:4px 8px;font-size:11px;text-align:left;border-bottom:1px solid #ccc">原材料名</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">使用量</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">単価</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">原材料費</th></tr></thead>'
      +'<tbody>'+rows+'</tbody>'
      +'<tfoot><tr style="border-top:2px solid #1a3a5c">'
      +'<td colspan="3" style="padding:4px 8px;font-size:12px;font-weight:700">原材料費合計</td>'
      +'<td style="padding:4px 8px;text-align:right;font-size:13px;font-weight:700;color:#1a3a5c">'+ingMaterial.toFixed(1)+'円</td></tr></tfoot>'
      +'</table>';
  }

  var resEl = document.getElementById('cost-result');
  if (!resEl) return;
  var rows2 = [
    {label:'原材料費',val:ingMaterial},
    {label:'加工費・労務費',val:labor},
    {label:'光熱費',val:utility},
    {label:'包材費',val:packaging},
    {label:'その他経費',val:other}
  ];
  var rhtml = '<table style="width:100%;border-collapse:collapse">';
  rows2.forEach(function(r){
    rhtml += '<tr><td style="padding:4px 8px;font-size:13px">'+r.label+'</td>'
      +'<td style="padding:4px 8px;text-align:right;font-size:13px">'+r.val.toFixed(1)+'<span style="font-size:11px;color:#888"> 円</span></td></tr>';
  });
  rhtml += '<tr style="border-top:2px solid #1a3a5c;background:#fff">'
    +'<td style="padding:8px;font-size:15px;font-weight:700;color:#1a3a5c">1袋あたり合計原価</td>'
    +'<td style="padding:8px;text-align:right;font-size:22px;font-weight:700;color:#1a3a5c">'+total.toFixed(1)+'<span style="font-size:13px;color:#888"> 円</span></td></tr>';
  rhtml += '</table>';
  resEl.innerHTML = rhtml;
  // バナーの1袋あたり原価を更新
  var bt = document.getElementById('banner-total');
  if (bt) bt.textContent = total.toFixed(1) + ' 円';
  // 送料情報（参考表示）
  var shipEl = document.getElementById('cost-shipping-ref');
  if (shipEl && masterData.shippingCosts.length > 0) {

}

function calcNutritionSilent() {
  var e=0, p=0, f=0, c=0, s=0, hasData=false;
  currentSpec.ings.forEach(function(ing){
    if (!ing.amount) return;
    hasData = true;
    var r = ing.amount / 100;
    e += (ing.e||0)*r; p += (ing.p||0)*r; f += (ing.f||0)*r;
    c += (ing.c||0)*r; s += (ing.s||0)*r;
  });
  if (hasData) {
    // 画面の栄養成分タブのフィールドを更新
    sv('n-e', Math.round(e)); sv('n-p', p.toFixed(1)); sv('n-f', f.toFixed(1));
    sv('n-c', c.toFixed(1)); sv('n-s', s.toFixed(2));
    // currentSpec.nutritionオブジェクトも更新（保存時に自動反映）
    if (!currentSpec.nutrition) currentSpec.nutrition = {};
    currentSpec.nutrition.e = Math.round(e);
    currentSpec.nutrition.p = +p.toFixed(1);
    currentSpec.nutrition.f = +f.toFixed(1);
    currentSpec.nutrition.c = +c.toFixed(1);
    currentSpec.nutrition.s = +s.toFixed(2);
  }
}

// Firestore collection: 'masters' / doc: 'material_prices', 'processing_costs', 'packaging_costs', 'shipping', 'additional_costs'

var masterData = {
  materialPrices:   [],  // 原材料価格マスター [{name, unitPrice, isOrganic, limitedTo}]
  processingCosts:  [],  // 商品別加工費マスター [{productName, laborCost, utilityCost}]
  packagingCosts:   [],  // 包材費マスター [{productName, cost, memo}]
  shippingCosts:    [],  // 送料マスター [{region, weight, cost, carrier}]
  additionalCosts:  [],  // 商品別追加コスト [{productName, itemName, cost}]

// ===== マスター初期化（Firestoreから読込） =====
function initMaster() {
  if (!db) { setTimeout(initMaster, 500); return; }
  loadMasterFromFirestore();
}

async function loadMasterFromFirestore() {
  try {
    var doc = await db.collection('masters').doc('all').get();
    if (doc.exists) {
      var d = doc.data();
      if (d.materialPrices)  masterData.materialPrices  = d.materialPrices;
      if (d.processingCosts) masterData.processingCosts = d.processingCosts;
      if (d.packagingCosts)  masterData.packagingCosts  = d.packagingCosts;
      if (d.shippingCosts)   masterData.shippingCosts   = d.shippingCosts;
      if (d.additionalCosts) masterData.additionalCosts = d.additionalCosts;
    }
    console.log('[Master] 読込完了');
  } catch(e) { console.warn('[Master] 読込失敗:', e.message); }
}

async function saveMasterToFirestore() {
  if (!db) { toast('Firestoreに接続されていません', true); return; }
  try {
    await db.collection('masters').doc('all').set(masterData);
    toast('マスターを保存しました ✓');
  } catch(e) { toast('マスター保存失敗: ' + e.message, true); }
}

// ===== マスターから規格書に価格を自動反映 =====
function matchMaster(ingName, masterName) {
  if (!ingName || !masterName) return false;
  if (ingName === masterName) return true;
  var n1 = ingName.replace(/^有機/,'').replace(/\s/g,'');
  var n2 = masterName.replace(/^有機/,'').replace(/\s/g,'');
  return n1 === n2;
}

function applyMasterToSpec() {
  if (!currentSpec || !currentSpec.ings) return;
  var applied = 0;
  var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
  currentSpec.ings.forEach(function(ing) {
    // 限定商品チェック：limitedToが空か商品名と一致するマスターを優先
    var mat = masterData.materialPrices.find(function(m) {
      if (!matchMaster(ing.name, m.name)) return false;
      return !m.limitedTo || m.limitedTo.trim() === '' || m.limitedTo === pname;
    });
    if (!mat) {
      // 限定なしで再検索
      mat = masterData.materialPrices.find(function(m) {
        return matchMaster(ing.name, m.name);
      });
    }
    if (mat) {
      if (mat.unitPrice > 0) ing.unitPrice = mat.unitPrice;
      // 栄養素もマスターから反映（FOOD_DBにない独自食材用）
      if (mat.e != null && mat.e > 0) ing.e = mat.e;
      if (mat.p != null) ing.p = mat.p;
      if (mat.f != null) ing.f = mat.f;
      if (mat.c != null) ing.c = mat.c;
      if (mat.s != null) ing.s = mat.s;
      // 有機フラグ
      if (mat.isOrganic && !ing.feature) ing.feature = '有機';
      applied++;
    }
  });
  // 商品別加工費・包材費を反映
  var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
  var proc = masterData.processingCosts.find(function(p){ return p.productName === pname; });
  if (proc) {
    if (!currentSpec.cost) currentSpec.cost = {};
    currentSpec.cost.laborCost   = proc.laborCost   || 0;
    currentSpec.cost.utilityCost = proc.utilityCost || 0;
  }
  var pkg = masterData.packagingCosts.find(function(p){ return p.productName === pname; });
  if (pkg) {
    if (!currentSpec.cost) currentSpec.cost = {};
    currentSpec.cost.packagingCost = pkg.cost || 0;
  }
  // 追加コスト合計
  var addCosts = masterData.additionalCosts.filter(function(a){ return a.productName === pname; });
  if (addCosts.length > 0) {
    if (!currentSpec.cost) currentSpec.cost = {};
    currentSpec.cost.otherCost = addCosts.reduce(function(s,a){ return s + (a.cost||0); }, 0);
  }
  if (applied > 0) toast('マスターから ' + applied + '品目の単価を反映しました ✓');
  return applied;
}

// ===== CSV エクスポート =====
function downloadCSV(filename, rows) {
  var bom = '\uFEFF';
  var csv = bom + rows.map(function(r){
    return r.map(function(v){
      var s = String(v==null?'':v);
      return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
function parseCSV(text) {
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  return lines.filter(function(l){return l.trim();}).map(function(line){
    var result = [], cur = '', inQ = false;
    for (var i=0; i<line.length; i++) {
      var c = line[i];
      if (c==='"') { if(inQ && line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
      else if (c===',' && !inQ) { result.push(cur); cur=''; }
      else cur += c;
    }
    result.push(cur);
    return result;
  });
}

function exportMaterialCSV() {
  var rows = [['原材料名','単価(円/kg)','有機(1=有機)','限定商品名','エネルギー(kcal/100g)','たんぱく質(g)','脂質(g)','炭水化物(g)','食塩相当量(g)']];
  masterData.materialPrices.forEach(function(m){
    rows.push([m.name, m.unitPrice, m.isOrganic?1:0, m.limitedTo||'', m.e||0, m.p||0, m.f||0, m.c||0, m.s||0]);
  });
  downloadCSV('原材料価格マスター.csv', rows);
}
function importMaterialCSV(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    var imported = 0;
    rows.forEach(function(r, i) {
      if (i===0 || r.length < 2) return; // ヘッダースキップ
      var name = r[0].trim();
      if (!name) return;
      var existing = masterData.materialPrices.find(function(m){return m.name===name;});
      if (existing) {
        existing.unitPrice = +r[1] || 0;
        if (r[2] !== undefined) existing.isOrganic = r[2]==='1'||r[2]==='true';
        if (r[3] !== undefined) existing.limitedTo = r[3].trim();
        if (r[4] !== undefined) existing.e = +r[4]||0;
        if (r[5] !== undefined) existing.p = +r[5]||0;
        if (r[6] !== undefined) existing.f = +r[6]||0;
        if (r[7] !== undefined) existing.c = +r[7]||0;
        if (r[8] !== undefined) existing.s = +r[8]||0;
      } else {
        masterData.materialPrices.push({name:name, unitPrice:+r[1]||0, isOrganic:r[2]==='1', limitedTo:(r[3]||'').trim(),
          e:+r[4]||0, p:+r[5]||0, f:+r[6]||0, c:+r[7]||0, s:+r[8]||0});
      }
      imported++;
    });
    renderMatTable();
    toast(imported + '件の原材料価格を取込みました ✓');
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}
