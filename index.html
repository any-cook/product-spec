function importPkgMasterCSV(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    var imported = 0;
    rows.forEach(function(r, i) {
      if (i===0 || r.length < 2) return;
      var name = r[0].trim(); if(!name) return;
      var ex = masterData.packagingCosts.find(function(m){ return m.name===name; });
      if (ex) {
        ex.type=r[1]||'unit'; ex.depth=r[2]||''; ex.width=r[3]||''; ex.height=r[4]||'';
        ex.material=r[5]||''; ex.unitPrice=+r[6]||0; ex.memo=r[7]||'';
      } else {
        masterData.packagingCosts.push({name:name,type:r[1]||'unit',depth:r[2]||'',width:r[3]||'',height:r[4]||'',material:r[5]||'',unitPrice:+r[6]||0,memo:r[7]||''});
      }
      imported++;
    });
   updateAccordionTitles();
    toast(imported+'件の包材マスターを取込みました ✓'); input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}

function mkTdBg(val, field, idx, arr, type, bg) {
  type = type || 'text';
  bg = bg || '#fff';
  var base = mkTd(val, field, idx, arr, type);

    'font-size:12px;padding:3px 5px;border:1px solid #ccc;border-radius:3px',
    'font-size:12px;padding:3px 5px;border:1.5px solid #8caccc;border-radius:3px;background:'+bg+';color:#111;font-weight:600'
  );
}

function sortMaterialPrices(key) {
  if (!key) return;
  masterData.materialPrices.sort(function(a, b) {
    switch(key) {
      case 'name':
        return (a.name||'').localeCompare(b.name||'', 'ja');
      case 'name_desc':
        return (b.name||'').localeCompare(a.name||'', 'ja');
      case 'unitPrice':
        return (a.unitPrice||0) - (b.unitPrice||0);
      case 'unitPrice_desc':
        return (b.unitPrice||0) - (a.unitPrice||0);
      case 'organic':
        return (b.isOrganic?1:0) - (a.isOrganic?1:0);
      case 'gmo':
        // GMO未確認（gmoCheckが空）を上に
        var aNeeds = ['大豆','とうもろこし','ばれいしょ','なたね','綿実','アルファルファ','てん菜','パパイヤ','からしな'].some(function(c){return (a.name||'').indexOf(c)>=0;});
        var bNeeds = ['大豆','とうもろこし','ばれいしょ','なたね','綿実','アルファルファ','てん菜','パパイヤ','からしな'].some(function(c){return (b.name||'').indexOf(c)>=0;});
        var aUncheck = aNeeds && !a.gmoCheck ? 1 : 0;
        var bUncheck = bNeeds && !b.gmoCheck ? 1 : 0;
        return bUncheck - aUncheck;
      default: return 0;
    }
  });
  renderMatTable();
  // ソート選択をリセット
  var sel = document.getElementById('mat-sort-key');
  if (sel) sel.value = '';
}

// ===== CSV エクスポート =====
function downloadCSV(filename, rows) {
  var bom = '\uFEFF';
  var csv = bom + rows.map(function(r){
    return r.map(function(v){
      var s = String(v==null?'':v);
      return s.includes(',') || s.includes('"') || s.includes('\n') ? '"' + s.replace(/"/g,'""') + '"' : s;
    }).join(',');
  }).join('\r\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}
function parseCSV(text) {
  var lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  return lines.filter(function(l){return l.trim();}).map(function(line){
    var result = [], cur = '', inQ = false;
    for (var i=0; i<line.length; i++) {
      var c = line[i];
      if (c==='"') { if(inQ && line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
      else if (c===',' && !inQ) { result.push(cur); cur=''; }
      else cur += c;
    }
    result.push(cur);
    return result;
  });
}

function importIngCSV(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    if (rows.length < 2) { toast('データがありません', true); return; }
    var header = rows[0].map(function(h){ return (h||'').trim().toLowerCase(); });
    var ci = {
      name:     header.findIndex(function(h){ return h.indexOf('原材料名')>=0||h.indexOf('name')>=0; }),
      amount:   header.findIndex(function(h){ return h.indexOf('使用量')>=0||h.indexOf('amount')>=0||h.indexOf('g数')>=0; }),
      price:    header.findIndex(function(h){ return h.indexOf('単価')>=0||h.indexOf('price')>=0; }),
      country:  header.findIndex(function(h){ return h.indexOf('産地')>=0||h.indexOf('country')>=0; }),
      allergens:header.findIndex(function(h){ return h.indexOf('アレルゲン')>=0||h.indexOf('allergen')>=0; }),
      supply:   header.findIndex(function(h){ return h.indexOf('支給')>=0||h.indexOf('supply')>=0; }),
      feature:  header.findIndex(function(h){ return h.indexOf('特色')>=0||h.indexOf('feature')>=0; }),
      gmo:      header.findIndex(function(h){ return h.indexOf('gmo')>=0||h.indexOf('組換')>=0; }),
      e:        header.findIndex(function(h){ return h.indexOf('kcal')>=0||h.indexOf('エネルギー')>=0; }),
      w:        header.findIndex(function(h){ return h.indexOf('水分')>=0; }),
      p:        header.findIndex(function(h){ return h.indexOf('たんぱく質')>=0||h.indexOf('蛋白')>=0; }),
      f:        header.findIndex(function(h){ return h.indexOf('脂質')>=0; }),
      c:        header.findIndex(function(h){ return h.indexOf('炭水化物')>=0; }),
      s:        header.findIndex(function(h){ return h.indexOf('食塩')>=0; }),
      sf:       header.findIndex(function(h){ return h.indexOf('飽和')>=0; }),
      fiber:    header.findIndex(function(h){ return h.indexOf('食物繊維')>=0; }),
    };
    var g = function(r, idx) { return idx>=0&&idx<r.length ? r[idx] : ''; };
    var imported = 0, updated = 0;
    rows.forEach(function(r, i) {
      if (i===0) return;
      var name = (g(r, ci.name)||'').trim();
      if (!name) return;
      // 既存行を検索して更新、なければ追加
      var ex = (currentSpec.ings||[]).find(function(ing){ return ing.name===name; });
      var obj = ex || {};
      obj.name      = name;
      if (ci.amount>=0)    obj.amount    = +g(r,ci.amount)||0;
      if (ci.price>=0)     obj.unitPrice = +g(r,ci.price)||0;
      if (ci.country>=0)   obj.country   = g(r,ci.country);
      if (ci.allergens>=0) obj.allergens = g(r,ci.allergens);
      if (ci.supply>=0)    obj.isSupply  = g(r,ci.supply)==='1';
      if (ci.feature>=0)   obj.feature   = g(r,ci.feature);
      if (ci.gmo>=0)       obj.gmo       = g(r,ci.gmo);
      if (ci.e>=0)         obj.e         = +g(r,ci.e)||0;
      if (ci.w>=0)         obj.w         = +g(r,ci.w)||0;
      if (ci.p>=0)         obj.p         = +g(r,ci.p)||0;
      if (ci.f>=0)         obj.f         = +g(r,ci.f)||0;
      if (ci.c>=0)         obj.c         = +g(r,ci.c)||0;
      if (ci.s>=0)         obj.s         = +g(r,ci.s)||0;
      if (ci.sf>=0)        obj.sf        = +g(r,ci.sf)||0;
      if (ci.fiber>=0)     obj.fiber     = +g(r,ci.fiber)||0;
      if (!ex) {
        if (!currentSpec.ings) currentSpec.ings = [];
        currentSpec.ings.push(obj);
        imported++;
      } else {
        updated++;
      }
    });
    renderIngTbody(); updateIngSummary(); recalcCost();
    // マスター未登録の原材料を自動登録
    var autoAdded = 0;
    (currentSpec.ings || []).forEach(function(ing) {
      if (!ing.name) return;
      var exists = masterData.materialPrices.find(function(m){ return m.name === ing.name; });
      if (!exists) {
        masterData.materialPrices.push({
          name: ing.name, generalName: '', isOrganic: false, isLimited: false, limitedTo: '',
          unitPrice: ing.unitPrice||0, origin: ing.country||'', allergens: ing.allergens||'',
          gmoCheck: ing.gmo||'', e: ing.e||0, w: ing.w||0, p: ing.p||0, f: ing.f||0,
          c: ing.c||0, s: ing.s||0, sf: ing.sf||0, fiber: ing.fiber||0
        });
        autoAdded++;
      }
    });
    if (autoAdded > 0) {
      saveMasterToFirestore();
      renderMatTable(); updateAccordionTitles();
      toast('CSV取込完了: 新規'+imported+'件・更新'+updated+'件 ✓ / マスター自動登録: '+autoAdded+'件');
    } else {
      toast('CSV取込完了: 新規'+imported+'件・更新'+updated+'件 ✓');
    }
    input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}

function importMaterialCSV(input) {

      organic:   header.findIndex(function(h){ return h.indexOf('有機')>=0; }),

        name        = (g(r, ci.name,        '')).trim();
        var generalNameVal = (g(r, ci.generalName, '')).trim();
        unitPrice = +g(r, ci.price,     0)||0;
        isOrganic = g(r, ci.organic,    '0')==='1';
        isLimited = g(r, ci.limited,    '0')==='1';
        limitedTo = g(r, ci.limitedTo,  '');
        origin    = g(r, ci.origin,     '');
        allergens = g(r, ci.allergens,  '');
        gmoCheck  = g(r, ci.gmo,        '');
        e   = +g(r, ci.e,   0)||0;
        w   = +g(r, ci.w,   0)||0;
        p   = +g(r, ci.p,   0)||0;
        f   = +g(r, ci.f,   0)||0;
        c   = +g(r, ci.c,   0)||0;
        ash = +g(r, ci.ash, 0)||0;
        s   = +g(r, ci.s,   0)||0;
        sf    = +g(r, ci.sf,    0)||0;
        fiber = +g(r, ci.fiber, 0)||0;} else {
        // ヘッダーなし → 旧形式A（原材料名から始まる）
        name=(r[0]||'').trim(); unitPrice=+r[1]||0;
        isOrganic=r[2]==='1'; limitedTo=r[3]||''; isLimited=!!limitedTo;
        origin=''; allergens=''; gmoCheck='';
        e=+r[4]||0; p=+r[5]||0; f=+r[6]||0; c=+r[7]||0; s=+r[8]||0; w=0; ash=0;
      }
      if (!name) return;
      var ex = masterData.materialPrices.find(function(m){ return m.name===name; });
      if (ex) {
        ex.generalName=generalNameVal||ex.generalName||''; ex.category=categoryVal||ex.category||''; ex.isOrganic=isOrganic; ex.isLimited=isLimited; ex.limitedTo=limitedTo;
        ex.unitPrice=unitPrice; ex.origin=origin; ex.allergens=allergens; ex.gmoCheck=gmoCheck;
        ex.e=e; ex.w=w; ex.p=p; ex.f=f; ex.c=c; ex.s=s; ex.sf=sf||0; ex.fiber=fiber||0;
      } else {
        masterData.materialPrices.unshift({
          name:name, generalName:generalNameVal||'', category:categoryVal||'', isOrganic:isOrganic, isLimited:isLimited, limitedTo:limitedTo,
          unitPrice:unitPrice, origin:origin, allergens:allergens, gmoCheck:gmoCheck,
          e:e, w:w, p:p, f:f, c:c, s:s, sf:sf, fiber:fiber
        });
      }
      imported++;
    });
    renderMatTable(); updateAccordionTitles();
    toast(imported + '件の原材料マスターを取込みました ✓'); input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}

function exportProcCSV() {
  var rows = [['加工条件','生産割合(%)','人件費(円)','光熱費(円)','加工費合計(円)']];
  masterData.processingCosts.forEach(function(m){
    var labor = m.laborCost||0, util = m.utilityCost||0;
    rows.push([m.condition||m.productName||'', m.productionRatio||100, labor, util, labor+util, m.bags||1]);
  });
  downloadCSV('加工費マスター.csv', rows);
}
function importProcCSV(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    var imported = 0;
    rows.forEach(function(r, i) {
      if (i===0 || r.length < 2) return;
      var cond = r[0].trim(); if(!cond) return;
      var ex = masterData.processingCosts.find(function(m){ return (m.condition||m.productName||'')===cond; });
      if (ex) {
        ex.condition = cond;
        if (r[1] !== undefined) ex.productionRatio = +r[1]||100;
        if (r[2] !== undefined) ex.laborCost   = +r[2]||0;
        if (r[3] !== undefined) ex.utilityCost = +r[3]||0;
      } else {
        masterData.processingCosts.push({condition:cond, productionRatio:+r[1]||100, laborCost:+r[2]||0, utilityCost:+r[3]||0});
      }
      imported++;
    });
    renderProcTable(); updateAccordionTitles(); toast(imported+'件の加工費マスターを取込みました ✓'); input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}

  masterData.packagingCosts.forEach(function(m){

  });

}
function importPkgCSV(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    var imported = 0;
    rows.forEach(function(r, i) {
      if (i===0 || r.length < 2) return;
      var name = r[0].trim(); if(!name) return;
      // 新形式: 商品名,縦,横,高さ,材質,重量,包材費,メモ
      // 旧形式: 商品名,包材費,メモ
      var isNew = r.length >= 7;
      var ex = masterData.packagingCosts.find(function(m){return m.productName===name;});
      if (isNew) {
        var obj = {productName:name, height:r[1]||'', width:r[2]||'', depth:r[3]||'', material:r[4]||'', weight:r[5]||'', cost:+r[6]||0, memo:r[7]||''};
        if (ex) Object.assign(ex, obj); else masterData.packagingCosts.push(obj);
      } else {
        if (ex) { ex.cost=+r[1]||0; ex.memo=r[2]||''; }
        else masterData.packagingCosts.push({productName:name, height:'', width:'', depth:'', material:'', weight:'', cost:+r[1]||0, memo:r[2]||''});
      }
      imported++;
    });
    renderPkgTable(); updateAccordionTitles(); toast(imported+'件の包材費マスターを取込みました ✓'); input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}

function importShipCSV(input) {

  reader.onload = function(e) {
    var rows = parseCSV(e.target.result);
    var imported = 0;
    rows.forEach(function(r, i) {
      if (i===0 || r.length < 2) return;
      // 新形式: 地域,サイズ区分,重量上限,送料,配送業者
      // 旧形式: 地域,重量上限,送料,配送業者
      var region, sizeCategory, weightLimit, cost, carrier;
      if (r.length >= 5) {
        region=r[0].trim(); sizeCategory=r[1].trim(); weightLimit=+r[2]||0; cost=+r[3]||0; carrier=r[4]||'';
      } else {
        region=r[0].trim(); sizeCategory=''; weightLimit=+r[1]||0; cost=+r[2]||0; carrier=r[3]||'';
      }
      masterData.shippingCosts.push({region:region, sizeCategory:sizeCategory, weightLimit:weightLimit, cost:cost, carrier:carrier});
      imported++;
    });
    renderShipTable(); updateAccordionTitles(); toast(imported + '件の送料を取込みました ✓'); input.value='';
  };
  reader.readAsText(file, 'UTF-8');
}
