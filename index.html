<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商品規格書管理システム | エニクック</title>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;font-size:14px;background:#f5f5f0;color:#222;min-height:100vh}
.header{background:#1a3a5c;color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header h1{font-size:15px;font-weight:700;letter-spacing:1px}
.header-right{display:flex;align-items:center;gap:10px;font-size:13px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block;transition:.3s}
.status-dot.online{background:#4caf50}
.app{display:flex;height:calc(100vh - 44px)}
.sidebar{width:220px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-header{padding:10px;border-bottom:1px solid #ddd;background:#f9f9f7}
.sidebar-header h3{font-size:12px;font-weight:700;color:#555;margin-bottom:8px}
.spec-list{flex:1;overflow-y:auto;padding:6px}
.spec-item{padding:9px 10px;border-radius:6px;border:1px solid #e0e0d8;background:#fff;margin-bottom:5px;cursor:pointer;transition:.15s}
.spec-item:hover{border-color:#1a3a5c;background:#f0f4f8}
.spec-item.active{border-color:#1a3a5c;background:#e8f0f8}
.spec-item-name{font-size:13px;font-weight:500;margin-bottom:2px}
.spec-item-meta{font-size:11px;color:#888}
.main{flex:1;overflow-y:auto;padding:14px}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid #ccc;background:#fff;color:#333;transition:.15s;white-space:nowrap}
.btn:hover{background:#f0f0ec}
.btn-primary{background:#1a3a5c;color:#fff;border-color:#1a3a5c}
.btn-primary:hover{background:#0f2740}
.btn-danger{background:#fff;color:#c62828;border-color:#e0a0a0}.btn-del{width:22px;height:22px;font-size:10px;line-height:1;padding:0;border:1px solid #e0a0a0;border-radius:3px;background:#fff;color:#c62828;cursor:pointer;display:block}
.btn-danger:hover{background:#fdecea}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-block{width:100%;margin-bottom:6px;display:block}
.tabs{display:flex;gap:3px;border-bottom:1px solid #ddd;margin-bottom:14px;flex-wrap:wrap;background:#fff;border-radius:8px 8px 0 0;padding:8px 8px 0}
.tab{padding:6px 12px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:2px solid transparent;transition:.15s}
.tab.active{color:#1a3a5c;border-bottom-color:#1a3a5c;font-weight:700}
.panel{display:none}.panel.active{display:block}
.card{background:#fff;border:1.5px solid #b0bec5;border-radius:8px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);color:#222}
.card h3{font-size:13px;font-weight:700;color:#1a3a5c;margin-bottom:10px;border-bottom:2px solid #cdd8e8;padding-bottom:6px;letter-spacing:.3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.field{margin-bottom:7px}
.fl{font-size:12px;color:#555;display:block;margin-bottom:2px;font-weight:500}
input[type=text],input[type=number],select,textarea{width:100%;font-size:13px;padding:6px 9px;border:1.5px solid #b0bec5;border-radius:5px;background:#fff;color:#222;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a3a5c;box-shadow:0 0 0 2px rgba(26,58,92,.1)}
textarea{resize:vertical;min-height:50px;line-height:1.5}
.ing-table{width:100%;border-collapse:collapse;font-size:12px}
.ing-table th{background:#eef2f7;padding:4px 5px;border:1px solid #ccc;font-size:11px;font-weight:700;text-align:center}
.ing-table td{border:1px solid #ccc;padding:2px 2px;vertical-align:middle}
.ing-table td input,.ing-table td select{font-size:12px;padding:3px 5px;border:none;background:transparent;width:100%}
.ing-table td input:focus,.ing-table td select:focus{background:#fff;border:1px solid #1a3a5c;border-radius:3px}
.search-box{position:relative}
.search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #bbb;border-radius:6px;z-index:200;max-height:180px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none}
.sr-item{padding:7px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #eee}
.sr-item:hover{background:#f0f4f8}
.proc-row{display:grid;grid-template-columns:2fr 3fr auto;gap:6px;align-items:center;margin-bottom:5px}
.al-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:20px;cursor:pointer;margin:2px;transition:.15s}
.al-chip:hover{border-color:#1a3a5c;background:#f0f4f8}
.preview-wrap{background:#ccc;padding:12px;border-radius:8px;overflow:auto}
.a4{background:#fff;color:#111;width:794px;min-height:1000px;margin:0 auto;padding:12mm 11mm;font-family:'Hiragino Kaku Gothic Pro','Meiryo',sans-serif;font-size:8pt;line-height:1.35;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.a4 h1{font-size:12pt;font-weight:700;text-align:center;border:2px solid #111;padding:4px;margin-bottom:7px;letter-spacing:2px}
.a4 .sec{font-size:8pt;font-weight:700;background:#ccc;border:1px solid #999;padding:2px 5px;margin:4px 0 2px}
.a4 table{width:100%;border-collapse:collapse;font-size:7.5pt}
.a4 table th,.a4 table td{border:1px solid #999;padding:2px 4px;vertical-align:top}
.a4 table th{background:#e8e8e8;font-weight:700;white-space:nowrap}
.a4 .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:4px}
.a4 .tgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:4px}
.a4 .lbox{border:1px solid #999;padding:3px 5px;font-size:7.5pt;line-height:1.4;margin-bottom:3px}
.a4 .note{font-size:6.5pt;color:#555;line-height:1.3;margin-top:2px}
.a4 .footer{font-size:6.5pt;color:#666;border-top:1px solid #999;margin-top:5px;padding-top:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:22px;width:400px;max-width:90vw}
.modal h2{font-size:15px;font-weight:700;margin-bottom:14px;color:#1a3a5c}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.loading{text-align:center;padding:30px;color:#888;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #ddd;border-top-color:#1a3a5c;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:#1a3a5c;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:400;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.error{background:#c62828}
.empty-state{text-align:center;padding:40px 20px;color:#999}
#toolbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}

// ===== ユーティリティ =====
function h(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function gv(id) { var el=document.getElementById(id); return el ? el.value : ''; }
function sv(id, val) { var el=document.getElementById(id); if(el) el.value = val || ''; }
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}
function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' error' : '') + ' show';
  setTimeout(function(){ t.className = 'toast' + (isErr ? ' error' : ''); }, 3000);
}

// ===== Firebase初期化 =====
function initFirebase() {
  try {
    if (!firebase.apps.length) firebase.initializeApp(FB_CFG);
    db = firebase.firestore();
    document.getElementById('status-dot').className = 'status-dot online';
    document.getElementById('status-text').textContent = 'Firestore 接続済み';
    loadList();
    initMaster(); // DB接続後にマスター読込
  } catch(e) {
    document.getElementById('status-text').textContent = '接続エラー';
    console.error(e);
    alert('Firebase接続エラー: ' + e.message);
  }
}

// ===== リスト操作 =====
async function loadList() {
  if (!db) return;
  document.getElementById('spec-list').innerHTML = '<div class="loading"><div class="spinner"></div>読込中...</div>';
  try {
    var snap = await db.collection('product_specs').orderBy('updatedAt','desc').get({source: 'server'});
    specListCache = [];
    snap.forEach(function(doc){ specListCache.push(Object.assign({id:doc.id}, doc.data())); });
    renderList();
  } catch(e) {
    document.getElementById('spec-list').innerHTML = '<div style="padding:10px;color:#c62828;font-size:12px">読込失敗: '+e.message+'</div>';
  }
}

function renderList() {
  var el = document.getElementById('spec-list');
  if (!specListCache.length) {
    el.innerHTML = '<div class="empty-state"><p style="font-size:13px">規格書がありません</p></div>';
    return;
  }
  el.innerHTML = '';
  specListCache.forEach(function(s) {
    var d = (s.updatedAt && typeof s.updatedAt.toDate === 'function') ? new Date(s.updatedAt.toDate()).toLocaleDateString('ja-JP') : '';
    var active = s.id === currentSpecId ? ' active' : '';
    var isSample = s.isSample ? true : false;
    var itemStyle = isSample ? 'opacity:0.5;border-style:dashed;' : '';
    var badge = isSample ? '<span style="font-size:10px;background:#e8f0f8;color:#1a3a5c;border-radius:3px;padding:1px 5px;margin-left:4px">見本</span>' : '';

    var wrap = document.createElement('div');
    wrap.className = 'spec-item' + active;
    wrap.style.cssText = itemStyle + ';position:relative;padding-right:64px';

    var body = document.createElement('div');
    var contentAmount = s.basic && s.basic.amount ? s.basic.amount : '';
    body.innerHTML = '<div class="spec-item-name">' + h(s.basic && s.basic.pname ? s.basic.pname : '（名称未設定）') + badge + '</div>'
      + '<div class="spec-item-meta">' + h(s.basic && s.basic.ptype ? s.basic.ptype : '') + ' | ' + d + '</div>'
      + (contentAmount ? '<div style="font-size:10px;color:#aaa;margin-top:1px">' + h(contentAmount) + '</div>' : '');
    body.addEventListener('click', (function(id){ return function(){ openSpec(id); }; })(s.id));

    var btns = document.createElement('div');
    btns.style.cssText = 'position:absolute;top:6px;right:6px;display:flex;gap:4px';

    var btnCopy = document.createElement('button');
    btnCopy.title = 'コピーして新規作成';
    btnCopy.textContent = '📋';
    btnCopy.style.cssText = 'background:#e8f0f8;border:1px solid #b0c4de;border-radius:4px;color:#1a3a5c;font-size:10px;padding:2px 5px;cursor:pointer';
    btnCopy.addEventListener('click', (function(id){ return function(e){ e.stopPropagation(); copySpec(id); }; })(s.id));

    var btnDel = document.createElement('button');
    btnDel.title = '削除';
    btnDel.textContent = '🗑';
    btnDel.style.cssText = 'background:#fff0f0;border:1px solid #e0a0a0;border-radius:4px;color:#c62828;font-size:10px;padding:2px 5px;cursor:pointer';
    btnDel.addEventListener('click', (function(id){ return function(e){ e.stopPropagation(); deleteSpec(id); }; })(s.id));

    btns.appendChild(btnCopy);
    btns.appendChild(btnDel);
    wrap.appendChild(body);
    wrap.appendChild(btns);
    el.appendChild(wrap);
  });
}

var _deleteTargetId = null;
function deleteSpec(id) {
  _deleteTargetId = id;
  var spec = specListCache.find(function(s){ return s.id === id; });
  var name = spec && spec.basic && spec.basic.pname ? spec.basic.pname : '（名称未設定）';
  var bar = document.getElementById('delete-confirm-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'delete-confirm-bar';
    bar.style.cssText = 'position:fixed;top:30%;left:50%;transform:translateX(-50%);background:#c62828;color:#fff;padding:16px 24px;border-radius:12px;z-index:99999;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,0.4);font-size:15px;flex-direction:column';
    document.body.appendChild(bar);
  }
  var msg = document.createElement('span');
  msg.textContent = '「' + name + '」を削除しますか？';
  var btnOk = document.createElement('button');
  btnOk.textContent = '削除する';
  btnOk.style.cssText = 'background:#fff;color:#c62828;border:none;border-radius:6px;padding:8px 20px;font-weight:700;cursor:pointer;font-size:16px';
  btnOk.onclick = function(){ doDeleteSpec(); };
  var btnCancel = document.createElement('button');
  btnCancel.textContent = 'キャンセル';
  btnCancel.style.cssText = 'background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer';
  btnCancel.onclick = function(){ bar.style.display='none'; _deleteTargetId=null; };
  bar.innerHTML = '';
  bar.appendChild(msg);
  bar.appendChild(btnOk);
  bar.appendChild(btnCancel);
  bar.style.display = 'flex';
}

function doDeleteSpec() {
  var bar = document.getElementById('delete-confirm-bar');
  if (bar) bar.style.display = 'none';
  var id = _deleteTargetId;
  _deleteTargetId = null;
  if (!id) { toast('削除対象が不明です', true); return; }
  var spec = specListCache.find(function(s){ return s.id === id; });
  var name = spec && spec.basic && spec.basic.pname ? spec.basic.pname : '（名称未設定）';
  db.collection('product_specs').doc(id).delete().then(function() {
    // キャッシュから即座に削除して再描画
    specListCache = specListCache.filter(function(s){ return s.id !== id; });
    if (currentSpecId === id) {
      currentSpec = null; currentSpecId = null;
      document.getElementById('editor').style.display = 'none';
      document.getElementById('empty-state').style.display = '';
    }
    renderList();
    toast('「' + name + '」を削除しました ✓');
  }).catch(function(e) {
    alert('削除エラー: ' + e.code + '\n' + e.message);
    toast('削除に失敗しました: ' + e.message, true);
  });
}


// ===== 規格書をコピーして新規作成 =====
function copySpec(id) {
  var src = specListCache.find(function(s){ return s.id === id; });
  if (!src) {
    // Firestoreから直接取得して複製
    db.collection('product_specs').doc(id).get().then(function(doc) {
      if (!doc.exists) { toast('規格書が見つかりません', true); return; }
      var data = doc.data();
      _doCopySpec(data);
    });
    return;
  }
  _doCopySpec(src);
}

function _doCopySpec(src) {
  // ディープコピー
  currentSpec = JSON.parse(JSON.stringify(src));
  // IDをクリア（新規として保存されるように）
  currentSpecId = null;
  // 商品名に「のコピー」を追加
  if (!currentSpec.basic) currentSpec.basic = {};
  currentSpec.basic.pname = (currentSpec.basic.pname || '') + '　のコピー';
  // 作成日を今日に更新
  currentSpec.basic.created = todayStr();
  // updatedAtをクリア
  delete currentSpec.updatedAt;
  // isSampleフラグをクリア
  currentSpec.isSample = false;
  renderList();
  renderEditor();
  toast('「' + (currentSpec.basic.pname || '') + '」としてコピーしました。内容を編集して保存してください ✓');
}

function newSpec() {
  currentSpecId = null;
  currentSpec = makeEmptySpec();
  renderList();
  renderEditor();
}

// ===== 既存を開く =====
async function openSpec(id) {
  if (!db) { toast('Firestoreに接続されていません',true); return; }
  currentSpecId = id;
  renderList();
  document.getElementById('main-area').innerHTML = '<div class="loading"><div class="spinner"></div>読込中...</div>';
  try {
    var doc = await db.collection('product_specs').doc(id).get();
    if (!doc.exists) { toast('規格書が見つかりません',true); return; }
    currentSpec = doc.data();
    if (!currentSpec.ings) currentSpec.ings = JSON.parse(JSON.stringify(DEFAULT_INGS));
    if (!currentSpec.procs) currentSpec.procs = JSON.parse(JSON.stringify(DEFAULT_PROCS));
    if (!currentSpec.pkg) currentSpec.pkg = makeEmptySpec().pkg;
    if (!currentSpec.basic) currentSpec.basic = makeEmptySpec().basic;
    if (!currentSpec.nutrition) currentSpec.nutrition = makeEmptySpec().nutrition;
    if (!currentSpec.cost) currentSpec.cost = {laborCost:0,utilityCost:0,packagingCost:0,otherCost:0};
    // lotCostsが保存されていれば必ず保持する
    if (!currentSpec.cost.lotCosts) currentSpec.cost.lotCosts = [];
    currentSpec.ings.forEach(function(ing){ if(ing.unitPrice==null) ing.unitPrice=0; });
    renderEditor();
    onMasterLoaded(function() {
      applyMasterToSpec();
      calcNutritionSilent();
    });
  } catch(e) {
    toast('読込失敗: '+e.message, true);
    console.error(e);
  }
}

// ===== 保存 =====
async function saveSpec() {
  if (!db) { toast('Firestoreに接続されていません',true); return; }
  collectForm();
  // Firestoreはundefinedを許容しないため再帰的に空文字へ変換（タイムスタンプ除く）
  (function sanitize(obj) {
    if (!obj || typeof obj !== 'object') return;
    if (typeof obj.toDate === 'function') return; // Firestoreタイムスタンプはスキップ
    Object.keys(obj).forEach(function(k) {
      if (k === 'updatedAt') return; // タイムスタンプフィールドはスキップ
      if (obj[k] === undefined) obj[k] = '';
      else if (obj[k] !== null && typeof obj[k] === 'object' && typeof obj[k].toDate !== 'function') sanitize(obj[k]);
    });
  })(currentSpec);
  currentSpec.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
  try {
    if (currentSpecId) {
      await db.collection('product_specs').doc(currentSpecId).set(currentSpec);
      toast('保存しました ✓');
    // 一覧のキャッシュを更新して内容量などを反映
    var idx2 = specListCache.findIndex(function(s){ return s.id === currentSpecId; });
    if (idx2 >= 0) { var cached = Object.assign({id: currentSpecId}, currentSpec); cached.updatedAt = null; specListCache[idx2] = cached; }
    renderList();
    } else {
      var ref = await db.collection('product_specs').add(currentSpec);
      currentSpecId = ref.id;
      toast('新規保存しました ✓');
    }
    loadList();
  } catch(e) {
    toast('保存失敗: '+e.message, true);
    console.error(e);
  }
}

async function confirmDelete() {
  if (!deleteTargetId || !db) return;
  try {
    await db.collection('product_specs').doc(deleteTargetId).delete();
    document.getElementById('del-modal').classList.remove('open');
    if (currentSpecId === deleteTargetId) {
      currentSpecId = null; currentSpec = null;
      document.getElementById('main-area').innerHTML = '<div class="empty-state"><div style="font-size:48px">📄</div><p>左の一覧から規格書を選んでください</p></div>';

// ===== フォーム収集 =====
function collectForm() {
  if (!currentSpec) return;
  var b = currentSpec.basic;
  ['pname','ptype','amount','expiry','country','storage','storage2','gmo','preservative','degradation','contami','mfr','maddr','created','buyer','buyerAddr','buyerContact'].forEach(function(k){
    var el = document.getElementById('f-'+k); if(el) b[k] = el.value || '';
    else if (b[k] === undefined) b[k] = '';
  });
  var n = currentSpec.nutrition;
  ['e','p','f','c','s','w','sf','su','fiber','ash','unit','note'].forEach(function(k){
    var el = document.getElementById('n-'+k); if(el) n[k] = el.value;
  });
  var pk = currentSpec.pkg;
  ['puD','puW','puH','puN','puWt','puMat','pcD','pcW','pcH','pcN','pcWt','pcMat'].forEach(function(k){
    var el = document.getElementById('pk-'+k); if(el) pk[k] = el.value;
  });
  var lt = document.getElementById('label-text'); if(lt) currentSpec.labelText = lt.value;
  var rn = document.getElementById('r-notes'); if(rn) currentSpec.notes = rn.value;
  var rc = document.getElementById('r-cooking'); if(rc) currentSpec.cooking = rc.value;
  var rs = document.getElementById('r-special'); if(rs) currentSpec.special = rs.value;
  currentSpec.allergens = [];
  document.querySelectorAll('#allergen-grid input:checked').forEach(function(cb){ currentSpec.allergens.push(cb.value); });
  if (!currentSpec.cost) currentSpec.cost = {};
  var co = currentSpec.cost;
  ['laborCost','utilityCost','packagingCost','otherCost'].forEach(function(k){
    var el = document.getElementById('co-'+k); if(el) co[k] = +el.value || 0;
  });
}

// ===== タブ切替 =====
function swTab(name) {
  // タブ切替前に現在の入力値を保存
  if (currentSpec) collectForm();

  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });

  // ⑦マスターパネルが未生成なら生成してmain-areaに追加
  if (!document.getElementById('panel-master')) {
    var mEl = document.createElement('div');
    mEl.innerHTML = renderMasterPanel();
    var mainArea = document.getElementById('main-area');
    if (mainArea) mainArea.appendChild(mEl.firstChild);
  }

  var tab   = document.getElementById('tab-' + name);
  var panel = document.getElementById('panel-' + name);
  if (tab)   tab.classList.add('active');
  if (panel) panel.classList.add('active');

  if (name === 'master') renderMasterTables();
  if (name === 'package') refreshPackagingSelects();
  if (name === 'cost') {
    refreshLotSelector();
    renderLotCostList();
    // 送料設定を再描画（選択状態を正しく表示）
    var shipWrap = document.getElementById('lot-proc-sel-wrap');
    recalcCost();
  }
  if (name === 'preview') genPreview();
}

// ===== ロット別加工費ドロップダウンを更新 =====
function refreshLotSelector() {
  var wrap = document.getElementById('lot-proc-sel-wrap');
  if (!wrap) return;
  wrap.innerHTML = buildLotSelector();
}

function buildLotSelector() {
  if (!masterData.processingCosts.length) {
    return '<span style="font-size:11px;color:#e67e22">⑦マスター登録→B.ロット別加工費マスターで加工条件を登録してください</span>';
  }
  var opts = '<option value="">加工条件を選択して追加...</option>';
  masterData.processingCosts.forEach(function(m, i) {
    var total = (m.laborCost||0) + (m.utilityCost||0);
    var label = (m.condition||m.productName||'加工条件'+(i+1))
      + (m.productionRatio ? ' ('+m.productionRatio+'%)' : '')
      + ' — ' + total.toLocaleString() + '円';
    opts += '<option value="'+i+'">' + h(label) + '</option>';
  });
  return '<select id="lot-proc-sel" style="flex:1;font-size:12px;padding:5px 8px;border:1.5px solid #b0bec5;border-radius:5px"'
    + ' onchange="addLotFromProcMasterByIndex(this.value)">'
    + opts
    + '</select>';
}

// ロット別加工費マスターのindex指定で追加
function addLotFromProcMasterByIndex(idx) {
  if (idx === '' || idx === null) return;
  var m = masterData.processingCosts[+idx];
  if (!m) return;
  if (!currentSpec.cost) currentSpec.cost = {};
  if (!currentSpec.cost.lotCosts) currentSpec.cost.lotCosts = [];
  var total = (m.laborCost||0) + (m.utilityCost||0);
  // 生産割合(%)が設定されていれば参考袋数として設定
  var refBags = m.bags && m.bags > 0 ? m.bags : (m.productionRatio && m.productionRatio > 0 ? m.productionRatio : 1);
  currentSpec.cost.lotCosts.push({
    label: m.condition || m.productName || ('加工条件'+(+idx+1)),
    cost:  total,
    bags:  refBags
  });
  renderLotCostList();
  recalcCost();
  toast('「'+(m.condition||m.productName||'')+'」をロット加工費に追加しました ✓');
  // セレクトをリセット
  var sel = document.getElementById('lot-proc-sel');
  if (!sel) { var wrap2=document.getElementById('lot-proc-sel-wrap'); if(wrap2) sel=wrap2.querySelector('select'); }
  if (sel) sel.value = '';
}

// ---- 送料セレクター生成 ----
function buildShipSelector(co) {
  var ships = masterData.shippingCosts;
  // 地域リストを一意抽出
  var regions = [];
  ships.forEach(function(s){ if(s.region && regions.indexOf(s.region)<0) regions.push(s.region); });
  // サイズ区分リストを一意抽出
  var sizes = [];
  ships.forEach(function(s){ if(s.sizeCategory && sizes.indexOf(s.sizeCategory)<0) sizes.push(s.sizeCategory); });

  var selRegion = co.shipRegion || '';
  var selSize   = co.shipSize   || '';

  var html = '';
  if (ships.length === 0) {
    // マスター未登録の場合は手動入力
    html += '<p style="font-size:12px;color:#e67e22;margin-bottom:8px">⑦マスター登録→E.送料マスターで送料を登録すると、ここから選択できます。</p>';
    html += '<div class="g2" style="margin-bottom:8px">'
      + '<div class="field"><label class="fl">送料（円）</label>'
      + '<input type="number" id="co-shipping" value="'+(co.shipping||0)+'" step="1" oninput="currentSpec.cost.shipping=+this.value;recalcCost()"></div>'
      + '</div>';
  } else {
    // マスターから選択
    var regionOpts = '<option value="">地域を選択</option>';
    regions.forEach(function(r){ regionOpts += '<option value="'+h(r)+'"'+(selRegion===r?' selected':'')+'>'+h(r)+'</option>'; });
    var sizeOpts = '<option value="">サイズを選択</option>';
    sizes.forEach(function(sz){ sizeOpts += '<option value="'+h(sz)+'"'+(selSize===sz?' selected':'')+'>'+h(sz)+'</option>'; });

    html += '<div class="g2" style="margin-bottom:8px">'
      + '<div class="field"><label class="fl">地域</label>'
      + '<select id="co-ship-region" onchange="selectShippingRate()">'+ regionOpts +'</select></div>'
      + '<div class="field"><label class="fl">サイズ区分</label>'
      + '<select id="co-ship-size" onchange="selectShippingRate()">'+ sizeOpts +'</select></div>'
      + '</div>'
      + '<div id="ship-match-result" style="margin-bottom:8px;padding:8px;background:#eef7f0;border-radius:6px;font-size:13px;display:none"></div>'
      + '<div class="g2">'
      + '<div class="field"><label class="fl">送料（円）</label>'
      + '<input type="number" id="co-shipping" value="'+(co.shipping||0)+'" step="1" oninput="currentSpec.cost.shipping=+this.value;recalcCost()"></div>'
      + '</div>';
  }
  // ロット別加工費の生産袋数を取得（設定済みなら自動表示）
  var autoBags = 0;
  if (currentSpec && currentSpec.cost && currentSpec.cost.lotCosts) {
    currentSpec.cost.lotCosts.forEach(function(lc){ if ((lc.bags||0) > autoBags) autoBags = lc.bags||0; });
  }
  var pcNVal = co.pcN || autoBags || 1;
  // 1袋あたり送料: 保存済みshipPerUnit > shipping÷pcN の優先順
  var perUnitVal = co.shipPerUnit > 0 ? co.shipPerUnit.toFixed(2)
    : (co.shipping && pcNVal ? ((co.shipping||0)/pcNVal).toFixed(2) : '0.00');
  html += '<div style="margin-top:8px;padding:10px 12px;background:#fff9e6;border:1.5px solid #e0a030;border-radius:8px">';
  html += '<div style="font-size:12px;font-weight:700;color:#c0392b;margin-bottom:8px">📦 1箱入数で送料を自動計算</div>';
  html += '<div class="g2">';
  html += '<div class="field"><label class="fl">1箱入数'+(autoBags>0?' <span style="color:#27ae60;font-size:11px">（ロットから: '+autoBags+'袋）</span>':'')+'</label>'
    + '<input type="number" id="co-pcN-ship" value="'+pcNVal+'" min="1" step="1"'
    + ' oninput="currentSpec.cost.pcN=+this.value;calcShipPerUnit()"'
    + ' style="border:2px solid #e0a030;font-weight:700">';
  html += '</div>';
  html += '<div class="field"><label class="fl">1袋あたり送料（自動計算）</label>'
    + '<input type="number" id="co-ship-per-unit" value="'+perUnitVal+'" readonly'
    + ' style="background:#fff9e6;color:#c0392b;font-weight:700;border:1.5px solid #e0a030">';
  html += '</div></div></div>';
  html += '<div class="field" style="margin-top:8px"><label class="fl">送料の扱い</label>'
    + '<select id="co-shipping-mode" onchange="currentSpec.cost.shippingMode=this.value;recalcCost()">'
    + '<option value="exclude"'+(co.shippingMode==='exclude'||!co.shippingMode?' selected':'')+'>送料別（合計に含めない）</option>'
    + '<option value="include"'+(co.shippingMode==='include'?' selected':'')+'>送料込み（合計に含める）</option>'
    + '</select></div>'
    + '<div id="cost-shipping-ref" style="font-size:12px;color:#888;margin-top:6px"></div>';
  return html;
}

// 送料マスターから地域・サイズを選択して金額を反映
function selectShippingRate() {
  var regionEl = document.getElementById('co-ship-region');
  var sizeEl   = document.getElementById('co-ship-size');
  if (!regionEl || !sizeEl) return;
  var region = regionEl.value;
  var size   = sizeEl.value;
  if (!currentSpec.cost) currentSpec.cost = {};
  currentSpec.cost.shipRegion = region;
  currentSpec.cost.shipSize   = size;

  // マスターから一致する送料を検索
  var matched = masterData.shippingCosts.filter(function(s){
    var regionOk = !region || s.region === region;
    var sizeOk   = !size   || s.sizeCategory === size;
    return regionOk && sizeOk;
  });

  var resEl = document.getElementById('ship-match-result');
  var shipEl2 = document.getElementById('co-shipping');

  if (matched.length > 0) {
    // 複数ある場合は最安値
    matched.sort(function(a,b){ return (a.cost||0)-(b.cost||0); });
    var best = matched[0];
    var cost = best.cost || 0;
    if (shipEl2) shipEl2.value = cost;
    currentSpec.cost.shipping = cost;
    // 1箱入数を取得してshipPerUnitを計算・保存
    var pcNEl3 = document.getElementById('co-pcN-ship');
    var pcN3 = +(pcNEl3 ? pcNEl3.value : co.pcN || 1) || 1;
    var perUnit3 = pcN3 > 0 ? cost / pcN3 : 0;
    currentSpec.cost.shipPerUnit = perUnit3;
    var puEl3 = document.getElementById('co-ship-per-unit');
    if (puEl3) puEl3.value = perUnit3.toFixed(2);
    if (resEl) {
      resEl.style.display = 'block';
      resEl.innerHTML = '📦 <strong>'+h(best.region)+'</strong>'
        + (best.sizeCategory ? ' / '+h(best.sizeCategory) : '')
        + (best.carrier ? ' ('+h(best.carrier)+')' : '')
        + ' → <strong style="color:#1a3a5c;font-size:15px">'+cost.toLocaleString()+'円</strong>';
    }
    recalcCost();
  } else if (region || size) {
    if (resEl) { resEl.style.display='block'; resEl.innerHTML='<span style="color:#c62828">該当する送料が見つかりません</span>'; }
  } else {
    if (resEl) resEl.style.display = 'none';
  }
}

// ===== 原材料テーブル =====
function calcRatio() {
  var total = currentSpec.ings.reduce(function(s,ing){ return s + (ing.amount||0); }, 0);
  currentSpec.ings.forEach(function(ing){
    ing.ratio = total > 0 ? ((ing.amount||0)/total*100).toFixed(1) : '0.0';
  });
  return total;
}

function ingCost(ing) {
  // 支給品は単価0扱い
  if (ing.isSupply) return 0;
  // 使用量(g) × 単価(円/kg) ÷ 1000
  return ((ing.amount||0) * (ing.unitPrice||0)) / 1000;
}

function updateIngField(i, field, val) {
  currentSpec.ings[i][field] = (field === 'amount' || field === 'unitPrice') ? +val : val;
  if (field === 'amount' || field === 'unitPrice') {
    // 重量・単価変更 → 栄養計算＋原価計算を同時更新
    calcNutritionSilent();
    updateIngSummary(); // recalcCostを内包
  } else if (field === 'name') {
    // 名前変更 → マスターを即照合して単価・栄養素を自動セット
    var ing = currentSpec.ings[i];
    var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
    var mat = masterData.materialPrices.find(function(m) {
      if (!matchMaster(ing.name, m.name)) return false;
      return !m.limitedTo || m.limitedTo.trim() === '' || m.limitedTo === pname;
    });
    if (!mat) mat = masterData.materialPrices.find(function(m){ return matchMaster(ing.name, m.name); });
    if (!mat) {
      // FOOD_DBからも検索（normName正規化・部分一致対応）
      var fd = findInFoodDB(ing.name);
      if (fd) {
        if (fd.e != null) ing.e = fd.e;
        if (fd.w != null) ing.w = fd.w;
        if (fd.p != null) ing.p = fd.p;
        if (fd.f != null) ing.f = fd.f;
        if (fd.c != null) ing.c = fd.c;
        if (fd.s != null) ing.s = fd.s;
        if (fd.sf != null)    ing.sf    = fd.sf;
        if (fd.fiber != null) ing.fiber = fd.fiber;
      }
    }
    if (mat) {
      if (mat.unitPrice > 0) {
        ing.unitPrice = mat.unitPrice;
        var prcEl = document.getElementById('prc-'+i);
        if (prcEl) prcEl.value = mat.unitPrice;
      }
      if (mat.e > 0) ing.e = mat.e;
      if (mat.p != null) ing.p = mat.p;
      if (mat.f != null) ing.f = mat.f;
      if (mat.c != null) ing.c = mat.c;
      if (mat.s != null)     ing.s     = mat.s;
      if (mat.w != null)     ing.w     = mat.w;
      if (mat.sf != null)    ing.sf    = mat.sf;
      if (mat.fiber != null) ing.fiber = mat.fiber;
      if (mat.gmoCheck) ing.gmo = mat.gmoCheck;
    }
    autoLabelText();
    updateIngSummary();
  } else if (field === 'allergens') {
    syncAllergens();
    updateIngSummary();
  } else {
    updateIngSummary();
  }
}

function updateIngSummary() {
  var total = calcRatio();
  var totalCost = currentSpec.ings.reduce(function(s,ing){ return s+ingCost(ing); }, 0);
  // フッター更新
  var fw = document.getElementById('foot-weight');
  var fc2 = document.getElementById('foot-cost');
  if (fw) fw.textContent = total.toFixed(1) + 'g';
  if (fc2) fc2.textContent = totalCost > 0 ? totalCost.toFixed(1) + '円' : '—';
  // バナー更新
  var bm = document.getElementById('banner-mat');
  var bw = document.getElementById('banner-weight');
  if (bm) bm.textContent = totalCost.toFixed(1) + ' 円';
  if (bw) bw.textContent = total.toFixed(1) + ' g';
  // セル更新（再描画なし）
  currentSpec.ings.forEach(function(ing, i) {
    var rCell = document.getElementById('ratio-cell-'+i);
    var cCell = document.getElementById('cost-cell-'+i);
    if (rCell) rCell.textContent = (ing.ratio || '0.0') + '%';
    if (cCell) {
      var c = ingCost(ing);
      cCell.textContent = c > 0 ? c.toFixed(1) + ' 円' : '—';
      cCell.style.color = c > 0 ? '#0f5132' : '#bbb';
      cCell.style.fontWeight = c > 0 ? '700' : '400';
    }
    // 栄養素セル更新
    var r2 = (ing.amount||0) / 100;
    var hasNut = (ing.e||0)>0 || (ing.w||0)>0 || (ing.p||0)>0 || (ing.f||0)>0 || (ing.c||0)>0 || (ing.ash||0)>0 || (ing.s||0)>0;
    var nutColor = hasNut ? '#5b3a8c' : '#ccc';
    var dash = '—';
    var nutData = [
      ['nut-e-'+i,    hasNut||r2>0 ? ((ing.e||0)    *r2).toFixed(0) : dash],
      ['nut-w-'+i,    hasNut||r2>0 ? ((ing.w||0)    *r2).toFixed(1) : dash],
      ['nut-p-'+i,    hasNut||r2>0 ? ((ing.p||0)    *r2).toFixed(1) : dash],
      ['nut-f-'+i,    hasNut||r2>0 ? ((ing.f||0)    *r2).toFixed(1) : dash],
      ['nut-c-'+i,    hasNut||r2>0 ? ((ing.c||0)    *r2).toFixed(1) : dash],
      ['nut-s-'+i,    hasNut||r2>0 ? ((ing.s||0)    *r2).toFixed(2) : dash],
      ['nut-sf-'+i,   hasNut||r2>0 ? ((ing.sf||0)   *r2).toFixed(2) : dash],
      ['nut-fib-'+i,  hasNut||r2>0 ? ((ing.fiber||0)*r2).toFixed(1) : dash],
      ['nut-ash-'+i,  hasNut||r2>0 ? ((ing.ash||0)  *r2).toFixed(2) : dash]
    ];
    nutData.forEach(function(nd) {
      var el = document.getElementById(nd[0]);
      if (el) { el.textContent = nd[1]; el.style.color = nutColor; }
    });
  });
  recalcCost();
  // フッターの栄養素合計を更新
  var ftE=0, ftW=0, ftP=0, ftF=0, ftC=0, ftS=0, ftSF=0, ftFib=0, ftAsh=0, hasAny=false;
  currentSpec.ings.forEach(function(ing){
    var r3 = (ing.amount||0)/100;
    ftE   += (ing.e||0)    *r3;
    ftW   += (ing.w||0)    *r3;
    ftP   += (ing.p||0)    *r3;
    ftF   += (ing.f||0)    *r3;
    ftC   += (ing.c||0)    *r3;
    ftS   += (ing.s||0)    *r3;
    ftSF  += (ing.sf||0)   *r3;
    ftFib += (ing.fiber||0)*r3;
    ftAsh += (ing.ash||0)  *r3;
    if ((ing.e||0)>0 || (ing.amount||0)>0) hasAny = true;
  });
  var fne  = document.getElementById('foot-nut-e');   if(fne)  fne.textContent  = hasAny ? Math.round(ftE)    : '—';
  var fnw  = document.getElementById('foot-nut-w');   if(fnw)  fnw.textContent  = hasAny ? ftW.toFixed(1)     : '—';
  var fnp  = document.getElementById('foot-nut-p');   if(fnp)  fnp.textContent  = hasAny ? ftP.toFixed(1)     : '—';
  var fnf  = document.getElementById('foot-nut-f');   if(fnf)  fnf.textContent  = hasAny ? ftF.toFixed(1)     : '—';
  var fnc  = document.getElementById('foot-nut-c');   if(fnc)  fnc.textContent  = hasAny ? ftC.toFixed(1)     : '—';
  var fns  = document.getElementById('foot-nut-s');   if(fns)  fns.textContent  = hasAny ? ftS.toFixed(2)     : '—';
  var fnsf = document.getElementById('foot-nut-sf');  if(fnsf) fnsf.textContent = hasAny ? ftSF.toFixed(2)    : '—';
  var fnfib= document.getElementById('foot-nut-fib'); if(fnfib)fnfib.textContent= hasAny ? ftFib.toFixed(1)   : '—';
  var fnash= document.getElementById('foot-nut-ash'); if(fnash)fnash.textContent= hasAny ? ftAsh.toFixed(2)   : '—';
}

function renderIngTbody() {
  var tbody = document.getElementById('ing-tbody');
  if (!tbody) return;
  calcRatio();
  var html = '';
  currentSpec.ings.forEach(function(ing, i) {
    var gmoOpts = ['','未確認','非組換え','組換え','不分別','対象外'].map(function(o){
      return '<option'+(ing.gmo===o?' selected':'')+'>'+o+'</option>';
    }).join('');
    var cost = ingCost(ing);
    var rowBg = i % 2 === 0 ? '#fff' : '#fafcff';
    // 栄養素（100gあたり値 × 使用量/100）
    var r = (ing.amount||0) / 100;
    var nutE    = ((ing.e||0)     * r).toFixed(0);
    var nutW    = ((ing.w||0)     * r).toFixed(1);
    var nutP    = ((ing.p||0)     * r).toFixed(1);
    var nutF    = ((ing.f||0)     * r).toFixed(1);
    var nutC    = ((ing.c||0)     * r).toFixed(1);
    var nutS    = ((ing.s||0)     * r).toFixed(2);
    var nutSF   = ((ing.sf||0)    * r).toFixed(2);
    var nutFib  = ((ing.fiber||0) * r).toFixed(1);
    var hasNut = (ing.e||0)>0||(ing.w||0)>0||(ing.p||0)>0||(ing.f||0)>0||(ing.c||0)>0||(ing.s||0)>0||(ing.sf||0)>0||(ing.fiber||0)>0;
    var nutStyle = 'text-align:right;padding:0 5px;font-size:11px;background:#f8f4ff;color:' + (hasNut ? '#5b3a8c' : '#ccc');

    html += '<tr style="background:'+rowBg+'">';
    html += '<td style="text-align:center;color:#aaa;font-size:11px;width:28px">'+(i+1)+'</td>';
    // 支給チェックボックス
    html += '<td style="text-align:center;background:'+(ing.isSupply?'#fff3cd':'#fff')+';padding:2px">'
      + '<input type="checkbox" '+(ing.isSupply?'checked':'')+' title="支給品（単価0円扱い）"'
      + ' onchange="currentSpec.ings['+i+'].isSupply=this.checked;renderIngTbody();updateIngSummary();recalcCost()"'
      + ' style="width:16px;height:16px;cursor:pointer">'
      + '</td>';
    html += '<td><input type="text" value="'+h(ing.name)+'" style="font-weight:500;'+(ing.isSupply?'color:#e67e22;':'')+'" oninput="updateIngField('+i+',\'name\',this.value)"></td>';
    html += '<td><input type="text" value="'+h(ing.country)+'" oninput="updateIngField('+i+',\'country\',this.value)"></td>';
    var alStyle = ing.allergens ? 'color:#c62828;font-weight:500' : '';
    html += '<td><input type="text" value="'+h(ing.allergens)+'" style="'+alStyle+'" oninput="updateIngField('+i+',\'allergens\',this.value)"></td>';
    // 重量
    html += '<td style="background:#f0faf4">';
    html += '<input type="number" id="amt-'+i+'" value="'+(ing.amount||0)+'" min="0" step="0.1"';
    html += ' style="text-align:right;font-weight:600;width:100%"';
    html += ' onchange="updateIngField('+i+',\'amount\',this.value)">';
    html += '</td>';
    // 単価（支給品はグレーアウト）
    var supplyStyle = ing.isSupply ? 'background:#f5f5f5;color:#aaa;text-decoration:line-through' : 'background:#f0faf4';
    html += '<td style="'+supplyStyle+'">';
    html += '<input type="number" id="prc-'+i+'" value="'+(ing.isSupply?0:(ing.unitPrice||0))+'" min="0" step="1"';
    html += ' style="text-align:right;width:100%;'+(ing.isSupply?'color:#aaa;':'')+'"';
    html += ' '+(ing.isSupply?'disabled':'')+' onchange="updateIngField('+i+',\'unitPrice\',this.value)">';
    html += '</td>';
    // 原材料費
    var costTxt = cost > 0 ? cost.toFixed(1)+' 円' : '—';
    var costColor = cost > 0 ? '#0f5132' : '#bbb';
    var costFw = cost > 0 ? '700' : '400';
    html += '<td id="cost-cell-'+i+'" style="text-align:right;padding:0 8px;background:#f0faf4;color:'+costColor+';font-size:12px;font-weight:'+costFw+'">'+costTxt+'</td>';
    // 配合比
    html += '<td id="ratio-cell-'+i+'" style="text-align:center;background:#e8f4fd;font-size:12px;color:#1a3a5c;font-weight:600">'+(ing.ratio||'0.0')+'%</td>';
    // 栄養素（使用量あたり計算値）
    html += '<td id="nut-e-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutE   : '—')+'</td>';
    html += '<td id="nut-w-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutW   : '—')+'</td>';
    html += '<td id="nut-p-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutP   : '—')+'</td>';
    html += '<td id="nut-f-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutF   : '—')+'</td>';
    html += '<td id="nut-c-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutC   : '—')+'</td>';
    html += '<td id="nut-s-'+i+'"   style="'+nutStyle+'">'+(hasNut||r>0 ? nutS   : '—')+'</td>';
    html += '<td id="nut-sf-'+i+'"  style="'+nutStyle+'">'+(hasNut||r>0 ? nutSF  : '—')+'</td>';
    html += '<td id="nut-fib-'+i+'" style="'+nutStyle+'">'+(hasNut||r>0 ? nutFib : '—')+'</td>';
    // 特色原材料
    html += '<td><input type="text" value="'+h(ing.feature)+'" oninput="updateIngField('+i+',\'feature\',this.value)"></td>';
    // 添加物用途
    html += '<td><input type="text" value="'+h(ing.addUse)+'" oninput="updateIngField('+i+',\'addUse\',this.value)"></td>';
    // 遺伝子組換え（マスターから自動反映・対象外はテキストのみ）
    var gmoVal2 = ing.gmo || '';
    var gmoText, gmoBg3, gmoColor3;
    if (gmoVal2 === '対象外') {
      gmoText = '対象外'; gmoBg3 = '#f5f5f5'; gmoColor3 = '#888';
    } else if (gmoVal2 === '非組換え') {
      gmoText = '非組換え'; gmoBg3 = '#e8f5e9'; gmoColor3 = '#155a32';
    } else if (gmoVal2 === '組換え') {
      gmoText = '組換え'; gmoBg3 = '#fff0f0'; gmoColor3 = '#c62828';
    } else if (gmoVal2 === '不分別') {
      gmoText = '不分別'; gmoBg3 = '#fff8e1'; gmoColor3 = '#b45309';
    } else {
      // 長い文章は「対象」と省略表示
      var shortGmo = (gmoVal2||'').length > 5 ? '対象' : (gmoVal2 || '—');

// ひらがな→カタカナ
function toKatakana(str) {
  return str.replace(/[ぁ-ゖ]/g, function(c){return String.fromCharCode(c.charCodeAt(0)+96);});
}
// カタカナ→ひらがな
function toHiragana(str) {
  return str.replace(/[ァ-ヶ]/g, function(c){return String.fromCharCode(c.charCodeAt(0)-96);});
}
// ローマ字→ひらがな変換
var ROMAJI_MAP = [
  ['shi','し'],['chi','ち'],['tsu','つ'],['sha','しゃ'],['shu','しゅ'],['sho','しょ'],
  ['cha','ちゃ'],['chu','ちゅ'],['cho','ちょ'],['tchi','っち'],['ttsu','っつ'],
  ['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],['nya','にゃ'],['nyu','にゅ'],['nyo','にょ'],
  ['hya','ひゃ'],['hyu','ひゅ'],['hyo','ひょ'],['mya','みゃ'],['myu','みゅ'],['myo','みょ'],
  ['rya','りゃ'],['ryu','りゅ'],['ryo','りょ'],['gya','ぎゃ'],['gyu','ぎゅ'],['gyo','ぎょ'],
  ['ja','じゃ'],['ji','じ'],['ju','じゅ'],['jo','じょ'],
  ['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],
  ['sa','さ'],['si','し'],['su','す'],['se','せ'],['so','そ'],
  ['ta','た'],['ti','ち'],['tu','つ'],['te','て'],['to','と'],
  ['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],
  ['ha','は'],['hi','ひ'],['fu','ふ'],['hu','ふ'],['he','へ'],['ho','ほ'],
  ['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],

  ['za','ざ'],['zi','じ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],
  ['da','だ'],['di','ぢ'],['du','づ'],['de','で'],['do','ど'],
  ['ba','ば'],['bi','び'],['bu','ぶ'],['be','べ'],['bo','ぼ'],
  ['pa','ぱ'],['pi','ぴ'],['pu','ぷ'],['pe','ぺ'],['po','ぽ'],
  ['a','あ'],['i','い'],['u','う'],['e','え'],['o','お'],['n','ん']
];
function romajiToHiragana(str) {
  var s = str.toLowerCase();
  s = s.replace(/([ksthnhmrygzdbp])\1/g, 'っ$1');
  for (var ri = 0; ri < ROMAJI_MAP.length; ri++) {
    s = s.split(ROMAJI_MAP[ri][0]).join(ROMAJI_MAP[ri][1]);
  }
  return s;
}
// 検索マッチ判定（ひらがな/カタカナ/ローマ字/よみがな対応）
function foodMatch(name, q) {
  if (!q) return false;
  var ql = q.toLowerCase();
  if (name.indexOf(q) >= 0) return true;
  if (name.indexOf(toKatakana(q)) >= 0) return true;
  if (name.indexOf(toHiragana(q)) >= 0) return true;
  var qHira = romajiToHiragana(ql);
  if (qHira !== ql) {
    if (name.indexOf(qHira) >= 0) return true;
    if (name.indexOf(toKatakana(qHira)) >= 0) return true;
  }
  // よみがな逆引き
  var qH = toHiragana(q.toLowerCase());
  for (var yomi in FOOD_YOMI) {
    if (yomi.indexOf(qH) === 0 || yomi.indexOf(q) === 0) {
      var targets = FOOD_YOMI[yomi];
      for (var t = 0; t < targets.length; t++) {
        if (name.indexOf(targets[t]) >= 0) return true;
      }
    }
  }
  return false;
}

// CSV形式: 商品名,内容量(g)  または 単純に数値1列（現在の商品に適用）
function importAmountCSV(input) {
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var rows = parseCSV(text);
    if (!rows.length) { toast('CSVが空です', true); input.value=''; return; }

    // 1列だけ（数値）の場合は現在の規格書の内容量に直接適用
    if (rows[0].length === 1 || (rows[0].length === 2 && !isNaN(rows[0][0]))) {
      var val = rows[0][0].trim();
      if (!isNaN(val) && +val > 0) {
        if (!currentSpec || !currentSpec.basic) { toast('規格書を開いてください', true); return; }
        currentSpec.basic.amount = +val + 'g';
        var el = document.getElementById('f-amount');
        if (el) el.value = currentSpec.basic.amount;
        toast('内容量を ' + currentSpec.basic.amount + ' に設定しました ✓');
        input.value = ''; return;
      }
    }

    // 2列形式: 商品名,内容量(g) → 商品名が一致するものを適用
    var pname = currentSpec && currentSpec.basic ? currentSpec.basic.pname : '';
    var applied = false;
    rows.forEach(function(r, i) {
      if (i === 0 && isNaN(r[1])) return; // ヘッダースキップ
      if (r.length < 2) return;
      var rName = r[0].trim();
      var rVal  = r[1].trim();
      if (rName === pname || !pname) {
        if (!isNaN(rVal) && +rVal > 0) {
          currentSpec.basic.amount = rVal + 'g';
          var el = document.getElementById('f-amount');
          if (el) el.value = currentSpec.basic.amount;
          applied = true;
        }
      }
    });
    if (applied) toast('内容量を設定しました ✓');
    else toast('一致する商品名が見つかりませんでした', true);
    input.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function updateLabelWithAdditive() {
  var el = document.getElementById('label-text');
  if (!el) return;
  var additive = (currentSpec.additiveText || '').trim();
  var cur = el.value;
  // アレルゲン部分を末尾から分離
  var alMatch = cur.match(/(\/（[^）]*を含む[^）]*）|、（一部に[^）]+を含む）)$/);
  var alText = alMatch ? alMatch[1] : '';
  var base = alMatch ? cur.slice(0, cur.length - alText.length) : cur;
  // 既存の添加物部分（/...）を除去
  base = base.replace(/\/[^/（（）]+$/, '').replace(/\/+$/, '');
  // 新しい値を組み立て
  var newVal = base;
  if (additive) newVal += '/' + additive;
  newVal += alText;
  el.value = newVal;
  if (currentSpec) currentSpec.labelText = el.value;
}

function rebuildLabelText() {
  // ボタンクリック時は完全再生成（手動編集上書き）
  var el = document.getElementById('label-text');
  if (!el) return;
  var sorted = currentSpec.ings.slice().sort(function(a, b) {
    var wa = a.amount||0, wb = b.amount||0;
    if (wa===0&&wb===0) return 0; if (wa===0) return 1; if (wb===0) return -1;
    return wb - wa;
  });
  var countryText = '';
  var basicCountry = currentSpec.basic && currentSpec.basic.country ? currentSpec.basic.country : '';
  if (basicCountry) countryText = '（原産国：' + basicCountry + '）';
  // 重量1位のみ産地を表示
  var maxAmount = 0;
  sorted.forEach(function(ing){ if ((ing.amount||0) > maxAmount) maxAmount = ing.amount||0; });
  var nameList = sorted.map(function(ing, idx) {
    if (!ing.name) return '';
    var origin = '';
    // マスターを取得（一般名称と産地のため）
    var mat = masterData.materialPrices.find(function(m){ return matchMaster(ing.name, m.name); });
    // 重量が最大のもの（1位）のみ産地を付ける
    if ((ing.amount||0) === maxAmount && maxAmount > 0) {
      if (mat && mat.origin) origin = mat.origin;
      else if (ing.country) origin = ing.country;
    }
    // マスターに一般名称があればそちらを使用
    var dispName = (mat && mat.generalName) ? mat.generalName : ing.name;
    return dispName + (origin ? '（'+origin+'）' : '');
  }).filter(Boolean).join('、');
  var checked = [];
  document.querySelectorAll('#allergen-grid input:checked').forEach(function(cb){ checked.push(cb.value); });
  var allergenText = checked.length ? '/（一部に'+checked.join('・')+'を含む）' : '';
  // 添加物を反映（/添加物 形式）
  var additive = currentSpec.additiveText || '';
  var labelVal = countryText + nameList;
  if (additive.trim()) labelVal += '/' + additive.trim();
  labelVal += allergenText;
  el.value = labelVal;
  if (currentSpec) currentSpec.labelText = el.value;
}

function autoLabelText() {
  var el = document.getElementById('label-text');
  if (!el) return;
  // 重量多い順にソート（0のものは元の順序を保持）
  var sorted = currentSpec.ings.slice().sort(function(a, b) {
    var wa = a.amount || 0, wb = b.amount || 0;
    if (wa === 0 && wb === 0) return 0;
    if (wa === 0) return 1;
    if (wb === 0) return -1;
    return wb - wa;
  });
  // 原産国：基本情報の製造国 または 原材料の産地から生成
  var countryText = '';
  var basicCountry = currentSpec.basic && currentSpec.basic.country ? currentSpec.basic.country : '';
  if (basicCountry) {
    countryText = '（原産国：' + basicCountry + '）';
  }
  // 「原材料名（産地）」形式で生成
  var nameList = sorted.map(function(ing) {
    if (!ing.name) return '';
    // 産地はマスターのoriginまたはing.countryを使用
    var origin = '';
    var mat = masterData.materialPrices.find(function(m){ return matchMaster(ing.name, m.name); });
    if (mat && mat.origin) origin = mat.origin;
    else if (ing.country) origin = ing.country;
    // マスターに一般名称があればそちらを使用
    var dispName = (mat && mat.generalName) ? mat.generalName : ing.name;
    return dispName + (origin ? '（'+origin+'）' : '');
  }).filter(Boolean).join('、');
  var checked = [];
  document.querySelectorAll('#allergen-grid input:checked').forEach(function(cb){ checked.push(cb.value); });
  var allergenText = checked.length ? '/（一部に'+checked.join('・')+'を含む）' : '';
  // 自動生成は初回のみ（currentSpec.labelTextが空の場合）
  // アレルゲン変更時は既存テキストのアレルゲン部分だけ更新
  var currentVal = el.value || '';
  var alPattern = /、（一部に[^）]+を含む）$/;
  if (currentVal === '' || !currentSpec.labelText) {
    // 初回生成
    el.value = countryText + nameList + allergenText;
  } else {
    // 既存テキストのアレルゲン部分だけ更新（手動編集を保持）
    var baseText = currentVal.replace(alPattern, '');
    el.value = baseText + allergenText;
  }
  if (currentSpec) currentSpec.labelText = el.value;
}

function syncAllergens() {
  var detected = new Set();
  currentSpec.ings.forEach(function(ing){
    // 規格書の原材料アレルゲン
    if (ing.allergens) ing.allergens.split(/[・、,\s]+/).filter(Boolean).forEach(function(a){ detected.add(a); });
    // マスターのアレルゲン列も参照
    var mat = masterData.materialPrices.find(function(m){ return matchMaster(ing.name, m.name); });
    if (mat && mat.allergens) mat.allergens.split(/[・、,\s]+/).filter(Boolean).forEach(function(a){ detected.add(a); });
  });
  // 28品目アレルゲングリッドと照合（部分一致）
  document.querySelectorAll('#allergen-grid input').forEach(function(cb){
    var val = cb.value;
    var hit = false;
    detected.forEach(function(a){
      if (a.indexOf(val) >= 0 || val.indexOf(a) >= 0) hit = true;
    });
    if (hit) cb.checked = true;
  });
  // アレルゲン部分のみ更新（手動編集を保持）
  updateAllergenPartOnly();
}

  var allergenText = checked.length ? '/（一部に'+checked.join('・')+'を含む）' : '';
  var currentVal = el.value || '';
  var baseText = currentVal.replace(/\/（一部に[^）]+を含む）$/, '').replace(/、（一部に[^）]+を含む）$/, '');
  el.value = baseText + allergenText;
  if (currentSpec) currentSpec.labelText = el.value;
}

// ===== 加工費マスターからロット加工費に追加 =====
function addLotFromProcMaster() {
  if (!currentSpec) return;
  if (!masterData.processingCosts.length) {
    toast('加工費マスターが未登録です。⑦マスター登録→B.加工費マスターで登録してください。', true);
    return;
  }
  if (!currentSpec.cost) currentSpec.cost = {};
  if (!currentSpec.cost.lotCosts) currentSpec.cost.lotCosts = [];
  var added = 0;
  masterData.processingCosts.forEach(function(m) {
    var total = (m.laborCost||0) + (m.utilityCost||0);
    if (!total) return;
    var refBags2 = m.bags && m.bags > 0 ? m.bags : (m.productionRatio && m.productionRatio > 0 ? m.productionRatio : 1);
    currentSpec.cost.lotCosts.push({
      label: m.condition || m.productName || '',
      cost:  total,
      bags:  refBags2
    });
    added++;
  });
  renderLotCostList();
  toast(added + '件の加工費マスターを反映しました ✓');
}

function addLotCost() {
  if (!currentSpec.cost) currentSpec.cost = {};
  if (!currentSpec.cost.lotCosts) currentSpec.cost.lotCosts = [];
  currentSpec.cost.lotCosts.push({label:'', cost:0, bags:1});
  renderLotCostList();
}

function renderLotCostList() {
  var el = document.getElementById('lot-cost-list');
  if (!el) return;
  var lotCosts = (currentSpec.cost && currentSpec.cost.lotCosts) || [];
  var html = '';
  lotCosts.forEach(function(lc, i) {
    html += '<div style="display:grid;grid-template-columns:1fr 100px 90px auto;gap:6px;margin-bottom:5px">';
    html += '<input type="text" value="'+h(lc.label||'')+'" placeholder="例：釜1回 500袋分"';
    html += ' style="font-size:13px;padding:5px 8px;border:1.5px solid #b0bec5;border-radius:5px"';
    html += ' oninput="currentSpec.cost.lotCosts['+i+'].label=this.value">';
    html += '<input type="number" value="'+(lc.cost||0)+'" placeholder="加工費(円)"';
    html += ' style="font-size:13px;padding:5px 8px;border:1.5px solid #b0bec5;border-radius:5px;text-align:right"';
    html += ' oninput="currentSpec.cost.lotCosts['+i+'].cost=+this.value;recalcCost()">';
    html += '<input type="number" value="'+(lc.bags||1)+'" placeholder="袋数"';
    html += ' style="font-size:13px;padding:5px 8px;border:1.5px solid #b0bec5;border-radius:5px;text-align:right"';
    html += ' oninput="currentSpec.cost.lotCosts['+i+'].bags=+this.value;recalcCost()">';
    html += '<button class="btn btn-sm btn-danger" onclick="currentSpec.cost.lotCosts.splice('+i+',1);renderLotCostList();recalcCost();" style="padding:3px 8px">✕</button>';
    html += '</div>';
  });
  if (!html) html = '<p style="font-size:12px;color:#aaa;padding:4px">ロットを追加してください</p>';
  el.innerHTML = html;
  recalcCost();
}

// 送料÷ケース入数 = 1袋あたり送料
function calcShipPerUnit() {
  if (!currentSpec) return;
  var pcNEl  = document.getElementById('co-pcN-ship');
  var shipEl = document.getElementById('co-shipping');
  var pcN    = +(pcNEl ? pcNEl.value : currentSpec.cost && currentSpec.cost.pcN || 1) || 1;
  var ship   = +(shipEl ? shipEl.value : currentSpec.cost && currentSpec.cost.shipping || 0) || 0;
  var perUnit = pcN > 0 ? ship / pcN : 0;
  currentSpec.cost = currentSpec.cost || {};
  currentSpec.cost.pcN        = pcN;
  currentSpec.cost.shipPerUnit = perUnit;
  var el = document.getElementById('co-ship-per-unit');
  if (el) el.value = perUnit.toFixed(2);
  recalcCost();
}

function recalcCost() {
  if (!currentSpec) return;
  var co = currentSpec.cost || {};
  if (!currentSpec.cost) currentSpec.cost = {};

  // ① 原材料費
  var ingMaterial = currentSpec.ings ? currentSpec.ings.reduce(function(s,ing){ return s+ingCost(ing); },0) : 0;

  // ② ロット別加工費（1袋あたり）
  var lotCosts = co.lotCosts || [];
  var lotPerBag = 0;
  lotCosts.forEach(function(lc){
    var bags = lc.bags || 1;
    if (bags > 0) lotPerBag += (lc.cost||0) / bags;
  });
  // ロット別加工費サマリー更新
  var lotSummary = document.getElementById('lot-cost-summary');
  var lotPerBagEl = document.getElementById('lot-per-bag');
  if (lotSummary) lotSummary.style.display = lotCosts.length > 0 ? 'block' : 'none';
  if (lotPerBagEl) lotPerBagEl.textContent = lotPerBag.toFixed(1);

  // ③ その他コスト
  var labor    = +(document.getElementById('co-laborCost')    ? document.getElementById('co-laborCost').value    : co.laborCost)    || 0;
  var utility  = +(document.getElementById('co-utilityCost')  ? document.getElementById('co-utilityCost').value  : co.utilityCost)  || 0;
  var packaging= +(document.getElementById('co-packagingCost')? document.getElementById('co-packagingCost').value: co.packagingCost)|| 0;
  var other    = +(document.getElementById('co-otherCost')    ? document.getElementById('co-otherCost').value    : co.otherCost)    || 0;

  // ④ 送料 → 1袋あたり送料（送料÷入数）を使用
  // 1袋あたり送料: DOM > 保存値 の優先順で取得
  var perUnitEl    = document.getElementById('co-ship-per-unit');
  var pcNEl2       = document.getElementById('co-pcN-ship');
  var shipBoxEl    = document.getElementById('co-shipping');
  var shipping;
  // 送料取得: DOM値 > 保存済shipPerUnit > 箱送料÷入数
  var shipBoxVal = +(shipBoxEl ? shipBoxEl.value : co.shipping || 0) || 0;
  var pcNVal2    = +(pcNEl2 ? pcNEl2.value : co.pcN || 1) || 1;
  if (perUnitEl && +perUnitEl.value > 0) {
    shipping = +perUnitEl.value;
  } else if (co.shipPerUnit > 0) {
    shipping = co.shipPerUnit;
    // DOMがある場合はDOMも更新
    if (perUnitEl) perUnitEl.value = shipping.toFixed(2);
  } else if (shipBoxVal > 0) {
    shipping = pcNVal2 > 0 ? shipBoxVal / pcNVal2 : 0;
  } else {
    shipping = 0;
  }
  currentSpec.cost.shipPerUnit = shipping;
  var shippingMode = (document.getElementById('co-shipping-mode')  ? document.getElementById('co-shipping-mode').value : co.shippingMode) || 'exclude';
  currentSpec.cost.shipping     = shipping;
  currentSpec.cost.shippingMode = shippingMode;

  // 合計（送料別）
  var subtotal = ingMaterial + lotPerBag + labor + utility + packaging + other;
  // 合計（送料込み）: 常にsubtotal + shipping
  var totalWithShip = subtotal + shipping;

  // ① 原材料費明細を更新
  // 商品別追加コストを自動反映・表示
  var addCostEl = document.getElementById('additional-cost-detail');
  if (addCostEl) {
    var pname3 = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
    var addItems = masterData.additionalCosts.filter(function(a){ return !a.productName || a.productName === pname3; });
    if (addItems.length > 0) {
      var addHtml = '<table style="width:100%;border-collapse:collapse;margin-bottom:6px">';
      addItems.forEach(function(a){
        addHtml += '<tr><td style="padding:3px 8px;font-size:12px">'+h(a.itemName||'')+'</td>'
          +'<td style="padding:3px 8px;text-align:right;font-size:12px;color:#1a3a5c;font-weight:700">'+(a.cost||0).toFixed(0)+' 円</td></tr>';
      });
      addHtml += '</table>';
      addCostEl.innerHTML = addHtml;
    } else {
      addCostEl.innerHTML = '<p style="font-size:12px;color:#aaa">商品別追加コストなし</p>';
    }
  }

  var detEl = document.getElementById('cost-ing-detail');
  if (detEl) {
    var rows = '';
    if (currentSpec.ings) {
      currentSpec.ings.forEach(function(ing){
        var c = ingCost(ing);
        if (!ing.name && !c) return;
        rows += '<tr>'
          +'<td style="padding:3px 8px;font-size:12px">'+h(ing.name)+'</td>'
          +'<td style="padding:3px 8px;text-align:right;font-size:12px">'+(ing.amount||0).toFixed(1)+'g</td>'
          +'<td style="padding:3px 8px;text-align:right;font-size:12px">'+(ing.unitPrice||0).toLocaleString()+'円/kg</td>'
          +'<td style="padding:3px 8px;text-align:right;font-size:12px;color:#1a3a5c;font-weight:700">'+c.toFixed(1)+'円</td>'
          +'</tr>';
      });
    }
    detEl.innerHTML = '<table style="width:100%;border-collapse:collapse;margin-bottom:4px">'
      +'<thead><tr style="background:#eef2f7">'
      +'<th style="padding:4px 8px;font-size:11px;text-align:left;border-bottom:1px solid #ccc">原材料名</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">使用量</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">単価</th>'
      +'<th style="padding:4px 8px;font-size:11px;text-align:right;border-bottom:1px solid #ccc">原材料費</th></tr></thead>'
      +'<tbody>'+rows+'</tbody>'
      +'<tfoot><tr style="border-top:2px solid #1a3a5c;background:#f0f4f8">'
      +'<td colspan="3" style="padding:5px 8px;font-size:12px;font-weight:700">原材料費合計</td>'
      +'<td style="padding:5px 8px;text-align:right;font-size:14px;font-weight:700;color:#1a3a5c">'+ingMaterial.toFixed(1)+' 円</td>'
      +'</tr></tfoot>'
      +'</table>';
  }

  // ⑤ 合計表示
  var resEl = document.getElementById('cost-result');
  if (!resEl) return;

  // 使用量合計（1袋の重量）を計算
  var totalWeightG = currentSpec.ings ? currentSpec.ings.reduce(function(s,ing){
    return s + (+(ing.amount)||0);
  }, 0) : 0;

  var items = [
    {label:'① 原材料費　（1袋 '+totalWeightG.toFixed(1)+'g）', val:ingMaterial, color:'#333'},
    {label:'② ロット別加工費（1袋あたり）', val:lotPerBag, color:'#333'},
    {label:'③ 加工費・労務費',  val:labor,       color:'#333'},
    {label:'③ 光熱費',          val:utility,     color:'#333'},
    {label:'③ 包材費',          val:packaging,   color:'#333'},
    {label:'③ その他経費',      val:other,       color:'#333'},
  ];

  var rhtml = '<table style="width:100%;border-collapse:collapse;font-size:14px">';

  // 各費用を行表示（0円は非表示）
  items.forEach(function(item){
    if (item.val === 0) return;
    rhtml += '<tr style="border-bottom:1px solid #eee">'
      +'<td style="padding:6px 12px;color:#444">'+item.label+'</td>'
      +'<td style="padding:6px 12px;text-align:right;font-weight:600;color:#222">'+Math.ceil(item.val).toLocaleString()+' 円</td>'
      +'</tr>';
  });

  // 利益XX% → 送料 → 合計
  var profRateForResult = co.profitRate || 20;
  var showRatesInResult = profRateForResult === 'all' ? [10,20,30] : [+profRateForResult];
  showRatesInResult.forEach(function(rate) {
    var sellP2 = subtotal / (1 - rate/100);
    var profitP2 = sellP2 - subtotal;
    var shipAmt = shippingMode !== 'include' ? shipping : 0;
    var finalP = Math.ceil(sellP2) + shipAmt;

    // 送料行と合計
    var shipAmt = shippingMode !== 'include' ? shipping : 0;
    var finalP = Math.ceil(sellP2) + shipAmt;

    // 利益行
    rhtml += '<tr style="background:#dcfce7;border-top:2px solid #22c55e">'
      +'<td style="padding:7px 12px;font-weight:700;color:#15803d">利益 '+rate+'%</td>'
      +'<td style="padding:7px 12px;text-align:right;font-size:17px;font-weight:700;color:#15803d">'
      +Math.ceil(sellP2).toLocaleString()+' 円'
      +'<span style="font-size:12px;color:#888;margin-left:8px">（利益: '+Math.ceil(profitP2).toLocaleString()+'円）</span>'
      +'</td></tr>';

    // 送料行（送料別の場合のみ表示）
    if (shippingMode !== 'include' && shipping > 0) {
      rhtml += '<tr style="background:#fff8f0;border-top:1px dashed #f0a020">'
        +'<td style="padding:6px 12px;color:#c0392b">送料（別途）</td>'
        +'<td style="padding:6px 12px;text-align:right;font-weight:600;color:#c0392b">'+Math.ceil(shipping).toLocaleString()+' 円</td>'
        +'</tr>';
    }

    // 合計行
    // 送料込み→合計に送料を含む / 送料別→合計に送料を含まない
    var totalLabel = shippingMode === 'include' ? '合計（送料込み）' : '合計';
    rhtml += '<tr style="border-top:2px solid #c0392b;background:#fef3f0">'
      +'<td style="padding:9px 12px;font-size:16px;font-weight:700;color:#c0392b">'+totalLabel+'</td>'
      +'<td style="padding:9px 12px;text-align:right;font-size:22px;font-weight:700;color:#c0392b">'
      +Math.ceil(sellP2).toLocaleString()+' 円</td>'
      +'</tr>';
  });

  rhtml += '</table>';
  resEl.innerHTML = rhtml;

  // ⑤ 送料行（送料別の場合のみ表示・0円でも表示）
  if (shippingMode !== 'include') {
    var shipDisp = shipping > 0 ? shipping.toFixed(0)+' 円' : '<span style="color:#c62828">未設定（⑤送料設定で選択してください）</span>';
    rhtml += '<tr style="background:#f5f5f0;border-top:1px solid #ccc">'
      +'<td style="padding:4px 8px;font-size:13px;color:#555">⑤ 送料</td>'
      +'<td style="padding:4px 8px;text-align:right;font-size:13px">'+shipDisp+'</td></tr>';
  }

  // 送料込み合計（送料別の場合 or 送料込みの場合）
  var totalLabel = shippingMode === 'include' ? '合計（送料込み）' : '合計（送料込み）　※送料別';
  rhtml += '<tr style="border-top:2px solid #e67e22;background:#fef9e7">'
    +'<td style="padding:8px;font-size:14px;font-weight:700;color:#e67e22">'+totalLabel+'</td>'
    +'<td style="padding:8px;text-align:right;font-size:20px;font-weight:700;color:#e67e22">'+totalWithShip.toFixed(1)+' <span style="font-size:12px;color:#888">円</span></td>'
    +'</tr>';

  rhtml += '</table>';
  resEl.innerHTML = rhtml;

  // バナー更新（送料モードに応じて）
  var bt = document.getElementById('banner-total');
  if (bt) bt.textContent = (shippingMode === 'include' ? totalWithShip : subtotal).toFixed(1) + ' 円';

  // 利益率別 販売価格シミュレーション
  var profitEl = document.getElementById('profit-table');
  if (profitEl) {
    var basePrice = shippingMode === 'include' ? totalWithShip : subtotal;
    // ③.5 送料前利益率（subtotalベース）を更新
    var profitInlineEl = document.getElementById('profit-table-inline');
    if (profitInlineEl) {
      var selectedRateEl = document.querySelector('input[name="profit-rate"]:checked');
      var selRate = selectedRateEl ? selectedRateEl.value : '20';
      if (currentSpec.cost) currentSpec.cost.profitRate = selRate === 'all' ? 'all' : +selRate;
      var inlineRates = selRate === '10' ? [10] : selRate === '30' ? [30] : selRate === 'all' ? [10,15,20,25,30,35,40] : [20];
      var iphtml = '<table style="width:100%;border-collapse:collapse">';
      iphtml += '<thead><tr style="background:#15803d;color:#fff">';
      iphtml += '<th style="padding:8px 12px;text-align:center">利益率</th>';
      iphtml += '<th style="padding:8px 12px;text-align:right">販売価格（税抜）</th>';
      iphtml += '<th style="padding:8px 12px;text-align:right">税込8%</th>';
      iphtml += '<th style="padding:8px 12px;text-align:right">税込10%</th>';
      iphtml += '<th style="padding:8px 12px;text-align:right">利益額</th>';
      iphtml += '</tr></thead><tbody>';
      inlineRates.forEach(function(rate) {
        var p = subtotal / (1 - rate/100);
        var p8 = p * 1.08, p10 = p * 1.10, profit = p - subtotal;
        var bg = (rate===20||rate===30) ? '#dcfce7' : '#fff';
        var fw = (rate===20||rate===30) ? '700' : '400';
        iphtml += '<tr style="background:'+bg+'"><td style="padding:7px 12px;text-align:center;font-size:15px;font-weight:700;color:#15803d">'+rate+'%</td>';
        iphtml += '<td style="padding:7px 12px;text-align:right;font-size:17px;font-weight:'+fw+';color:#1a3a5c">'+Math.ceil(p).toLocaleString()+' 円</td>';
        iphtml += '<td style="padding:7px 12px;text-align:right;color:#555">'+Math.ceil(p8).toLocaleString()+' 円</td>';
        iphtml += '<td style="padding:7px 12px;text-align:right;color:#555">'+Math.ceil(p10).toLocaleString()+' 円</td>';
        iphtml += '<td style="padding:7px 12px;text-align:right;color:#c0392b;font-weight:'+fw+'">'+Math.ceil(profit).toLocaleString()+' 円</td></tr>';
      });
      iphtml += '</tbody></table>';
      profitInlineEl.innerHTML = iphtml;
    }
    var phtml = '<table style="width:100%;border-collapse:collapse">';
    phtml += '<thead><tr style="background:#2a5a2e;color:#fff">';
    phtml += '<th style="padding:6px 10px;text-align:center">利益率</th>';
    phtml += '<th style="padding:6px 10px;text-align:right">販売価格（税抜）</th>';
    phtml += '<th style="padding:6px 10px;text-align:right">販売価格（税込8%）</th>';
    phtml += '<th style="padding:6px 10px;text-align:right">販売価格（税込10%）</th>';
    phtml += '<th style="padding:6px 10px;text-align:right">利益額</th>';
    phtml += '</tr></thead><tbody>';
    [10,15,20,25,30,35,40].forEach(function(rate) {
      var price    = basePrice / (1 - rate/100);
      var price8   = price * 1.08;
      var price10  = price * 1.10;
      var profit   = price - basePrice;
      var rowBg    = rate % 20 === 0 ? '#e8f5e9' : '#fff';
      phtml += '<tr style="background:'+rowBg+'">';
      phtml += '<td style="padding:5px 10px;text-align:center;font-weight:700;color:#2a5a2e">'+rate+'%</td>';
      phtml += '<td style="padding:5px 10px;text-align:right;font-size:14px;font-weight:700;color:#1a3a5c">'+Math.ceil(price).toLocaleString()+' 円</td>';
      phtml += '<td style="padding:5px 10px;text-align:right;color:#555">'+Math.ceil(price8).toLocaleString()+' 円</td>';
      phtml += '<td style="padding:5px 10px;text-align:right;color:#555">'+Math.ceil(price10).toLocaleString()+' 円</td>';
      phtml += '<td style="padding:5px 10px;text-align:right;color:#c0392b">'+Math.ceil(profit).toLocaleString()+' 円</td>';
      phtml += '</tr>';
    });
    phtml += '</tbody></table>';
    profitEl.innerHTML = phtml;
  }

  // 送料マスター参照
  var shipEl = document.getElementById('cost-shipping-ref');
  if (shipEl) {
    if (masterData.shippingCosts.length > 0) {
      var totalW = currentSpec.ings ? currentSpec.ings.reduce(function(s,i){return s+(i.amount||0);},0)/1000 : 0;
      var matched = masterData.shippingCosts.filter(function(s){ return (+s.weightLimit||0) >= totalW; });
      matched.sort(function(a,b){ return (a.cost||0)-(b.cost||0); });
      if (matched.length > 0) {
        shipEl.innerHTML = '<span style="color:#1a3a5c">📦 送料マスター参照: '+h(matched[0].region)+' '+matched[0].cost+'円（'+h(matched[0].carrier)+'）</span>';
      } else {
        shipEl.textContent = '送料マスターに該当する地域がありません';
      }
    } else {
      shipEl.textContent = '送料マスター未登録（⑦マスター登録で設定）';
    }
  }
}

// ===== 栄養再計算 =====
function calcNutritionSilent() {
  var e=0, w=0, p=0, f=0, c=0, s=0, sf=0, fiber=0, hasData=false;
  currentSpec.ings.forEach(function(ing){
    var amount = ing.amount || 0;
    if (amount <= 0) return;
    hasData = true;
    var r = amount / 100;
    e     += (ing.e||0)     * r;
    w     += (ing.w||0)     * r;
    p     += (ing.p||0)     * r;
    f     += (ing.f||0)     * r;
    c     += (ing.c||0)     * r;
    s     += (ing.s||0)     * r;
    sf    += (ing.sf||0)    * r;
    fiber += (ing.fiber||0) * r;
  });
  if (hasData) {
    sv('n-e',     Math.round(e));
    sv('n-w',     w.toFixed(1));
    sv('n-p',     p.toFixed(1));
    sv('n-f',     f.toFixed(1));
    sv('n-c',     c.toFixed(1));
    sv('n-s',     s.toFixed(2));
    sv('n-sf',    sf.toFixed(2));
    sv('n-fiber', fiber.toFixed(1));
    if (!currentSpec.nutrition) currentSpec.nutrition = {};
    currentSpec.nutrition.e     = Math.round(e);
    currentSpec.nutrition.w     = +w.toFixed(1);
    currentSpec.nutrition.p     = +p.toFixed(1);
    currentSpec.nutrition.f     = +f.toFixed(1);
    currentSpec.nutrition.c     = +c.toFixed(1);
    currentSpec.nutrition.s     = +s.toFixed(2);
    currentSpec.nutrition.sf    = +sf.toFixed(2);
    currentSpec.nutrition.fiber = +fiber.toFixed(1);
  }
}

function calcNutrition() {
  var e=0, w=0, p=0, f=0, c=0, s=0, sf=0, fiber=0, hasData=false;
  currentSpec.ings.forEach(function(ing){
    var amount = ing.amount || 0;
    if (amount <= 0) return;
    hasData = true;
    var r = amount / 100;
    e     += (ing.e||0)     * r;
    w     += (ing.w||0)     * r;
    p     += (ing.p||0)     * r;
    f     += (ing.f||0)     * r;
    c     += (ing.c||0)     * r;
    s     += (ing.s||0)     * r;
    sf    += (ing.sf||0)    * r;
    fiber += (ing.fiber||0) * r;
  });
  if (hasData) {
    sv('n-e',     Math.round(e));
    sv('n-w',     w.toFixed(1));
    sv('n-p',     p.toFixed(1));
    sv('n-f',     f.toFixed(1));
    sv('n-c',     c.toFixed(1));
    sv('n-s',     s.toFixed(2));
    sv('n-sf',    sf.toFixed(2));
    sv('n-fiber', fiber.toFixed(1));
    if (!currentSpec.nutrition) currentSpec.nutrition = {};
    currentSpec.nutrition.e     = Math.round(e);
    currentSpec.nutrition.w     = +w.toFixed(1);
    currentSpec.nutrition.p     = +p.toFixed(1);
    currentSpec.nutrition.f     = +f.toFixed(1);
    currentSpec.nutrition.c     = +c.toFixed(1);
    currentSpec.nutrition.s     = +s.toFixed(2);
    currentSpec.nutrition.sf    = +sf.toFixed(2);
    currentSpec.nutrition.fiber = +fiber.toFixed(1);
    toast('栄養計算しました ✓');

  var mat = masterData.packagingCosts.find(function(m){

    if (mat.height)  { currentSpec.pkg.puD   = mat.height;   var el=document.getElementById('pk-puD');   if(el) el.value=mat.height; }

    var pcN = currentSpec.pkg.pcN ? +currentSpec.pkg.pcN : 1;
    var puCost = mat.cost || mat.unitPrice || 0;
    var caseCostPerUnit = 0;

    currentSpec.cost.pkgUnitCost = puCost;
    calcPackagingCostAuto();
    toast('個装包材「'+name+'」を反映しました ✓');

    calcPackagingCostAuto();
    toast('ケース「'+name+'」を反映しました ✓');
  }
}

// 包材費自動計算（個装費 + ケース費÷入数）
function calcPackagingCostAuto() {
  if (!currentSpec || !currentSpec.pkg) return;
  var pk = currentSpec.pkg;
  var co = currentSpec.cost || {};
  var puCost   = co.pkgUnitCost  || 0;  // 個装1枚の単価
  var pcCost   = co.pkgCaseCost  || 0;  // ケース1箱の単価
  var pcN      = +(pk.pcN || 1);         // ケース入数
  // 1袋あたりの包材費 = 個装単価 + ケース単価÷入数
  var totalPkg = puCost + (pcN > 0 ? pcCost / pcN : 0);
  currentSpec.cost.packagingCost = Math.round(totalPkg * 100) / 100;
  // 画面の包材費入力欄を更新
  var el = document.getElementById('co-packagingCost');
  if (el) el.value = currentSpec.cost.packagingCost.toFixed(2);
  // 原価計算再実行
  recalcCost();
  toast('包材費を自動計算しました: ' + currentSpec.cost.packagingCost.toFixed(2) + '円/袋 ✓');
}

function moveProc(i, dir) {
  var j = i + dir;
  if (j < 0 || j >= currentSpec.procs.length) return;
  var tmp = currentSpec.procs[i];
  currentSpec.procs[i] = currentSpec.procs[j];
  currentSpec.procs[j] = tmp;
  renderProcList();
}

function renderProcList() {
  var el = document.getElementById('proc-list');
  if (!el) return;
  var total = currentSpec.procs.length;
  var html = '';
  currentSpec.procs.forEach(function(p, i){
    html += '<div style="display:grid;grid-template-columns:auto 1fr 1fr auto auto auto;gap:5px;align-items:center;margin-bottom:4px">';
    html += '<span style="color:#aaa;font-size:11px;min-width:20px;text-align:center">'+(i+1)+'</span>';

    html += '<input type="text" value="'+h(p.ctrl)+'" placeholder="管理基準" oninput="currentSpec.procs['+i+'].ctrl=this.value">';
    html += '<button class="btn btn-sm" style="padding:2px 7px;font-size:13px" '+(i===0?'disabled':'')+' onclick="moveProc('+i+',-1)">▲</button>';
    html += '<button class="btn btn-sm" style="padding:2px 7px;font-size:13px" '+(i===total-1?'disabled':'')+' onclick="moveProc('+i+',1)">▼</button>';
    html += '<button class="btn btn-sm btn-danger" onclick="removeProc('+i+')" style="padding:2px 6px">✕</button>';
    html += '</div>';
  });
  el.innerHTML = html;
}

function initMaster() {
  if (!db) { setTimeout(initMaster, 500); return; }
  loadMasterFromFirestore();
}

var masterLoaded = false;
var masterLoadedCallbacks = [];
function onMasterLoaded(fn) {
  if (masterLoaded) { fn(); } else { masterLoadedCallbacks.push(fn); }
}

async function loadMasterFromFirestore() {
  try {
    var doc = await db.collection('masters').doc('all').get();
    if (doc.exists) {
      var d = doc.data();
      if (d.materialPrices)   masterData.materialPrices   = d.materialPrices;
      if (d.processingCosts)  masterData.processingCosts  = d.processingCosts;
      if (d.packagingMaster)  {
        // 旧packagingMasterをpackagingCostsに移行
        d.packagingMaster.forEach(function(pm) {
          var exists = masterData.packagingCosts.find(function(pc){ return pc.name===pm.name; });
          if (!exists) masterData.packagingCosts.push({
            name: pm.name, productName: pm.name,
            type: pm.type||'unit',
            height: pm.depth||'', width: pm.width||'', depth: pm.height||'',
            material: pm.material||'', weight: '', unitPrice: pm.unitPrice||0,
            cost: pm.unitPrice||0, memo: pm.memo||''
          });
        });
      }
      if (d.packagingCosts)   masterData.packagingCosts   = d.packagingCosts;
      if (d.shippingCosts)    masterData.shippingCosts    = d.shippingCosts;
      if (d.additionalCosts)  masterData.additionalCosts  = d.additionalCosts;
      if (d.cautionMaster)    masterData.cautionMaster    = d.cautionMaster;
      if (d.cookingMaster)    masterData.cookingMaster    = d.cookingMaster;
      // master-areaが存在すれば再描画（常に存在するはず）
      renderMasterTables();
      // 荷姿タブの包材選択ドロップダウンを更新
      refreshPackagingSelects();
      refreshLotSelector();
      var total = masterData.materialPrices.length + masterData.processingCosts.length
                + masterData.packagingCosts.length + masterData.shippingCosts.length
                + masterData.additionalCosts.length;
      if (total > 0) toast('マスター読込完了（原材料' + masterData.materialPrices.length + '品目）✓');
    }
    masterLoaded = true;
    masterLoadedCallbacks.forEach(function(fn){ fn(); });
    masterLoadedCallbacks = [];
    console.log('[Master] 読込完了');
  } catch(e) { console.warn('[Master] 読込失敗:', e.message); }
}

async function saveMasterToFirestore() {
  if (!db) { toast('Firestoreに接続されていません', true); return; }

// ===== マスターから規格書に価格を自動反映 =====
function normName(s) {
  if (!s) return '';
  return s
    .replace(/\s/g, '')               // 空白除去
    .replace(/^(有機|国産|無農薬|特選|特製|純正|天然|国内産)/g, '') // 一般的なプレフィックス除去
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); }) // 全角英数→半角
    .replace(/[ａ-ｚ]/g, function(c){ return c.toUpperCase(); })  // 半角小文字→大文字
    .replace(/[a-z]/g, function(c){ return c.toUpperCase(); })    // 半角英小文字→大文字
    .toLowerCase()                     // 最終的に小文字統一
    .replace(/ヲ/g,'オ').replace(/ヴ/g,'ブ') // カタカナ異字体
    .replace(/[−－‐]/g,'-');          // ハイフン統一
}
function findInFoodDB(name) {
  // 完全一致
  if (FOOD_DB[name]) return FOOD_DB[name];
  // normName正規化後に一致検索
  var n1 = normName(name);
  var keys = Object.keys(FOOD_DB);
  for (var i = 0; i < keys.length; i++) {
    if (normName(keys[i]) === n1) return FOOD_DB[keys[i]];
  }
  // 部分一致（3文字以上）
  for (var j = 0; j < keys.length; j++) {
    var n2 = normName(keys[j]);
    var shorter = n1.length <= n2.length ? n1 : n2;
    var longer  = n1.length <= n2.length ? n2 : n1;
    if (shorter.length >= 3 && longer.indexOf(shorter) !== -1) return FOOD_DB[keys[j]];
  }
  return null;
}

function matchMaster(ingName, masterName) {
  if (!ingName || !masterName) return false;
  if (ingName === masterName) return true;
  var n1 = normName(ingName);
  var n2 = normName(masterName);
  if (n1 === n2) return true;
  // 片方が他方を含む（短い方が3文字以上の場合のみ）
  var shorter = n1.length <= n2.length ? n1 : n2;
  var longer  = n1.length <= n2.length ? n2 : n1;
  if (shorter.length >= 3 && longer.indexOf(shorter) !== -1) return true;
  return false;
}

function applyMasterToSpec() {
  if (!currentSpec || !currentSpec.ings) return;
  var applied = 0;
  var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
  currentSpec.ings.forEach(function(ing) {
    // 限定商品チェック：limitedToが空か商品名と一致するマスターを優先
    var mat = masterData.materialPrices.find(function(m) {
      if (!matchMaster(ing.name, m.name)) return false;
      return !m.limitedTo || m.limitedTo.trim() === '' || m.limitedTo === pname;
    });
    if (!mat) {
      // 限定なしで再検索
      mat = masterData.materialPrices.find(function(m) {
        return matchMaster(ing.name, m.name);
      });
    }
    if (mat) {
      if (mat.unitPrice > 0) ing.unitPrice = mat.unitPrice;
      // 栄養素もマスターから反映（FOOD_DBにない独自食材用）
      if (mat.e  != null && mat.e  > 0) ing.e     = mat.e;
      if (mat.w  != null)               ing.w     = mat.w;
      if (mat.p  != null)               ing.p     = mat.p;
      if (mat.f  != null)               ing.f     = mat.f;
      if (mat.c  != null)               ing.c     = mat.c;
      if (mat.s  != null)               ing.s     = mat.s;
      if (mat.sf != null)               ing.sf    = mat.sf;
      if (mat.fiber != null)            ing.fiber = mat.fiber;
      // 有機フラグ
      if (mat.isOrganic && !ing.feature) ing.feature = '有機';
      // GMO確認結果をマスターから反映
      if (mat.gmoCheck) ing.gmo = mat.gmoCheck;
      if (mat.allergens && !ing.allergens) ing.allergens = mat.allergens;
      applied++;
    } else {
      // マスター未登録 → FOOD_DBから栄養素のみ補完
      console.log('[applyMaster] 未マッチ:', JSON.stringify(ing.name), '/ normName:', normName(ing.name));
      var fd = findInFoodDB(ing.name);
      if (fd) {
        if (fd.e != null) ing.e = fd.e;
        if (fd.w != null) ing.w = fd.w;
        if (fd.p != null) ing.p = fd.p;
        if (fd.f != null) ing.f = fd.f;
        if (fd.c != null) ing.c = fd.c;
        if (fd.s != null) ing.s = fd.s;
        if (fd.sf != null)    ing.sf    = fd.sf;
        if (fd.fiber != null) ing.fiber = fd.fiber;
        applied++;
      }
    }
  });
  // 商品別加工費・包材費を反映
  var pname = currentSpec.basic && currentSpec.basic.pname ? currentSpec.basic.pname : '';
  var proc = masterData.processingCosts.find(function(p){ return p.productName === pname; });
  if (proc) {
    if (!currentSpec.cost) currentSpec.cost = {};
    // lotCostsは上書きしない（既存データを保持）
    currentSpec.cost.laborCost   = proc.laborCost   || 0;
    currentSpec.cost.utilityCost = proc.utilityCost || 0;
    if (!currentSpec.cost.lotCosts) currentSpec.cost.lotCosts = [];
  }
  var pkg = masterData.packagingCosts.find(function(p){ return p.productName === pname; });
  if (pkg) {
    if (!currentSpec.cost) currentSpec.cost = {};
    currentSpec.cost.packagingCost = pkg.cost || 0;
  }
  // 追加コスト合計
  var addCosts = masterData.additionalCosts.filter(function(a){ return a.productName === pname; });
  if (addCosts.length > 0) {
    if (!currentSpec.cost) currentSpec.cost = {};
    currentSpec.cost.otherCost = addCosts.reduce(function(s,a){ return s + (a.cost||0); }, 0);
  }
  if (applied > 0) {
    toast('マスターから ' + applied + '品目の単価・栄養素を反映しました ✓');
    renderIngTbody();
    calcNutritionSilent();
  }
  // 包材選択ドロップダウンも更新
  refreshPackagingSelects();
  // 栄養成分を再計算
  calcNutritionSilent();
  return applied;
}
